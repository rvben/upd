[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "upd"
dynamic = ["version"]
description = "Local-first dependency updates for polyglot repositories, including Python, Node.js, Rust, Go, Ruby, .NET, Terraform, GitHub Actions, pre-commit, and Mise"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ruben Jongejan", email = "ruben.jongejan@gmail.com" }]
keywords = ["dependencies", "update", "python", "nodejs", "rust", "go", "ruby", "terraform", "github-actions"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Build Tools",
]
requires-python = ">=3.8"

[project.urls]
Homepage = "https://github.com/rvben/upd"
Repository = "https://github.com/rvben/upd"
Documentation = "https://github.com/rvben/upd#readme"
Changelog = "https://github.com/rvben/upd/blob/main/CHANGELOG.md"
Issues = "https://github.com/rvben/upd/issues"
Security = "https://github.com/rvben/upd/security/policy"

[tool.maturin]
bindings = "bin"
manifest-path = "Cargo.toml"
python-packages = ["python/upd_cli"]
strip = true
