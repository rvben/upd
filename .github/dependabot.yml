version: 2
# Temporary migration guard for GitHub Actions updates. Remove this file after
# four successful weekly runs of `.github/workflows/upd.yml`; upd already owns
# the long-term update workflow and GitHub vulnerability alerts remain enabled
# independently of this file. Burn-in: 2/4 scheduled runs succeeded on
# 2026-08-18 and 2026-08-25; retire after successful 2026-09-01 and 2026-09-08 runs.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:58"
      timezone: Europe/Amsterdam
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
