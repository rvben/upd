name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag; required for publication, optional for dry runs"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Dry run mode (do not publish)"
        required: false
        default: true
        type: boolean
      skip_crates_io:
        description: "Skip crates.io publish"
        required: false
        default: false
        type: boolean
      skip_pypi:
        description: "Skip PyPI publish"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      release-ref: ${{ steps.release.outputs.release-ref }}
      release-commit: ${{ steps.release.outputs.release-commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve and validate release metadata
        id: release
        env:
          DRY_RUN: ${{ inputs.dry_run || false }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            tag="$GITHUB_REF_NAME"
            release_ref="$GITHUB_SHA"
            release_commit="$GITHUB_SHA"
            package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          elif [[ "$DRY_RUN" == true ]]; then
            package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
            tag="${REQUESTED_VERSION:-v${package_version}}"
            release_ref="$GITHUB_SHA"
            release_commit="$GITHUB_SHA"
          else
            if [[ -z "$REQUESTED_VERSION" ]]; then
              echo "a non-dry manual release requires the explicit existing tag" >&2
              exit 4
            fi
            tag="$REQUESTED_VERSION"
            git fetch --force origin "+refs/tags/${tag}:refs/tags/${tag}"
            release_ref="refs/tags/${tag}"
            release_commit="$(git rev-parse "${release_ref}^{commit}")"
            package_version="$(git show "${release_ref}:Cargo.toml" | sed -n 's/^version = "\([^"]*\)"/\1/p' | head -1)"
          fi

          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release tag must be an exact stable v-prefixed version" >&2
            exit 4
          fi
          if [[ "$tag" != "v${package_version}" ]]; then
            echo "release tag $tag does not match package version $package_version" >&2
            exit 2
          fi

          {
            echo "version=$package_version"
            echo "tag=$tag"
            echo "release-ref=$release_ref"
            echo "release-commit=$release_commit"
          } >> "$GITHUB_OUTPUT"

  test:
    name: Run tests
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.release-ref }}

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          experimental: true
          install: false

      - name: Install Rust
        run: mise install rust

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Run tests
        run: make check

  build:
    name: Build ${{ matrix.target }}
    needs: [metadata, test]
    # Guard: self-hosted runners only execute on trusted events (tag push,
    # workflow_dispatch). Fork PRs must never dispatch jobs to self-hosted.
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: [self-hosted, macOS, ARM64]
            target: x86_64-apple-darwin
          - os: [self-hosted, macOS, ARM64]
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.release-ref }}

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          experimental: true
          install: false

      - name: Install base build tools
        run: mise install rust python zig

      - name: Install cargo tool bootstrap
        run: mise install cargo-binstall

      - name: Install Rust build tools
        run: mise install cargo:maturin cargo:cargo-zigbuild

      - name: Verify zig installation
        if: matrix.os == 'ubuntu-latest'
        run: mise exec zig -- zig version

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build wheel
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [[ "$TARGET" == *-musl ]]; then
            mise exec -- maturin build --release --target "$TARGET" --compatibility musllinux_1_2 --zig
          elif [[ "$TARGET" == *-gnu ]]; then
            mise exec -- maturin build --release --target "$TARGET" --compatibility manylinux2014 --zig
          else
            mise exec -- maturin build --release --target "$TARGET"
          fi
        shell: bash

      - name: Build binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [[ "$TARGET" == *-linux-* ]]; then
            mise exec -- cargo zigbuild --release --target "$TARGET"
          else
            cargo build --release --target "$TARGET"
          fi
        shell: bash

      - name: Create release archives
        env:
          RUNNER_OS: ${{ runner.os }}
          TARGET: ${{ matrix.target }}
        run: |
          VERSION="$RELEASE_TAG"
          mkdir -p release-package

          if [[ "$RUNNER_OS" == Windows ]]; then
            cp "target/${TARGET}/release/upd.exe" release-package/upd.exe
            cd release-package
            powershell -command "Compress-Archive -Path upd.exe -DestinationPath ../upd-${VERSION}-${TARGET}.zip"
            cd ..
            powershell -command "Get-FileHash -Path upd-${VERSION}-${TARGET}.zip -Algorithm SHA256 | Select-Object -ExpandProperty Hash" > "upd-${VERSION}-${TARGET}.zip.sha256"
          else
            cp "target/${TARGET}/release/upd" release-package/upd
            tar -czf "upd-${VERSION}-${TARGET}.tar.gz" -C release-package upd
            if [[ "$RUNNER_OS" == macOS ]]; then
              shasum -a 256 "upd-${VERSION}-${TARGET}.tar.gz" > "upd-${VERSION}-${TARGET}.tar.gz.sha256"
            else
              sha256sum "upd-${VERSION}-${TARGET}.tar.gz" > "upd-${VERSION}-${TARGET}.tar.gz.sha256"
            fi
          fi
          rm -rf release-package
        shell: bash

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: target/wheels/*
          name: wheel-${{ matrix.target }}
          if-no-files-found: error

      - name: Upload release archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: |
            upd-*-${{ matrix.target }}.tar.gz*
            upd-*-${{ matrix.target }}.zip*
          name: release-${{ matrix.target }}
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    needs: [metadata, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.release-ref }}
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          experimental: true
          install: false
      - name: Install base source-distribution tools
        run: mise install rust python
      - name: Install cargo tool bootstrap
        run: mise install cargo-binstall
      - name: Install maturin
        run: mise install cargo:maturin
      - name: Build source distribution
        run: mise exec -- maturin sdist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: target/wheels/*.tar.gz
          name: sdist
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [metadata, build, sdist]
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.release-ref }}
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          experimental: true
          install: false

      - name: Install publication tools
        run: mise install rust uv

      - name: Publish to crates.io
        if: ${{ inputs.dry_run != true && inputs.skip_crates_io != true }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

      - name: Test crates.io publish (dry run)
        if: ${{ inputs.dry_run == true && inputs.skip_crates_io != true }}
        run: |
          echo "DRY RUN: Would publish to crates.io"
          cargo publish --dry-run --locked

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Publish to PyPI
        if: ${{ inputs.dry_run != true && inputs.skip_pypi != true }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          uv tool run twine upload artifacts/wheel-*/*.whl artifacts/sdist/*.tar.gz

      - name: Test PyPI upload (dry run)
        if: ${{ inputs.dry_run == true && inputs.skip_pypi != true }}
        run: |
          echo "DRY RUN: Would upload to PyPI:"
          find artifacts/wheel-* -name "*.whl" -type f | sort
          find artifacts/sdist -name "*.tar.gz" -type f | sort
          echo ""
          echo "Checking packages:"
          uv tool run twine check artifacts/wheel-*/*.whl artifacts/sdist/*.tar.gz

      - name: Extract release notes
        id: release_notes
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          if [ -f CHANGELOG.md ]; then
            NOTES=$(sed -n "/^## \\[${VERSION}\\]/,/^## \\[/p" CHANGELOG.md | sed '$d')
            if [ -z "$NOTES" ]; then
              NOTES="Release v${VERSION}"
            fi
          else
            NOTES="Release v${VERSION}"
          fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: ${{ inputs.dry_run != true }}
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          body: ${{ steps.release_notes.outputs.notes }}
          fail_on_unmatched_files: true
          files: |
            artifacts/release-*/upd-*.tar.gz
            artifacts/release-*/upd-*.tar.gz.sha256
            artifacts/release-*/upd-*.zip
            artifacts/release-*/upd-*.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest published release archives
        if: ${{ inputs.dry_run != true }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/release-*/upd-*.tar.gz
            artifacts/release-*/upd-*.zip

      - name: Notify upd-pre-commit
        if: ${{ inputs.dry_run != true && inputs.skip_pypi != true }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.PRECOMMIT_DISPATCH_TOKEN }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/rvben/upd-pre-commit/dispatches \
            -d "{\"event_type\": \"pypi_release\", \"client_payload\": {\"version\": \"$VERSION\"}}"

      - name: Dry Run Summary
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "## 🧪 Dry Run Complete!"
          echo ""
          echo "All artifacts were built but nothing was published."
          echo ""
          echo "To do an actual release:"
          echo "1. Uncheck 'Dry run mode' and provide an existing tag when running manually, OR"
          echo "2. Create and push a version tag"

  synchronize-release-pins:
    name: Synchronize integration release pins
    needs: [metadata, release]
    if: ${{ inputs.dry_run != true }}
    permissions:
      attestations: read
      contents: write
      pull-requests: write
    uses: ./.github/workflows/sync-release-pins.yml
    with:
      version: ${{ needs.metadata.outputs.tag }}
      release_commit: ${{ needs.metadata.outputs.release-commit }}
