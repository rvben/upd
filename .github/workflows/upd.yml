name: upd dependency health

on:
  schedule:
    - cron: "58 6 * * 2"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    uses: rvben/upd/.github/workflows/dependency-health.yml@e60a9d1056ea12b51858c566fa073024406eac98 # v0.5.1
    with:
      upd-version: v0.5.1
      min-age: 7d
      max-bump: minor
      validation-command: make check
      fail-on-blocked: false
