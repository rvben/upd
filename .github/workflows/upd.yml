name: upd dependency health

on:
  schedule:
    - cron: "58 6 * * 2"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    uses: ./.github/workflows/dependency-health.yml
    with:
      min-age: 7d
      max-bump: minor
      validation-command: make check
      fail-on-blocked: false
