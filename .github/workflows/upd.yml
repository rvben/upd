name: upd dependency health

on:
  schedule:
    - cron: "58 6 * * 2"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    uses: rvben/upd/.github/workflows/dependency-health.yml@775abc628f6b609eea48f126fb8a2f21543dfc18 # v0.6.0
    with:
      upd-version: v0.5.2
      min-age: 7d
      max-bump: minor
      validation-command: make check
      fail-on-blocked: false
