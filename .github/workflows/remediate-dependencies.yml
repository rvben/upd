name: Rust security remediation

on:
  schedule:
    - cron: "47 7 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish or clean up the rolling remediation pull request
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  remediate:
    uses: rvben/upd/.github/workflows/dependency-remediation.yml@ac374e74eb4f6b5cbd39965c65292ae5e2b51411 # v0.9.2
    with:
      publish: >-
        ${{ github.event_name == 'schedule' ||
            (github.event_name == 'workflow_dispatch' && inputs.publish) }}
      langs: rust
      allowed-paths: Cargo.toml Cargo.lock
      validation-command: make check
      branch: security/upd
      commit-message: "fix(deps): remediate vulnerable Rust dependencies with upd"
