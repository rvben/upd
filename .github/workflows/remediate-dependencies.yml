name: Rust security remediation

on:
  schedule:
    - cron: "47 7 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish or clean up the rolling remediation pull request
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

jobs:
  remediate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      vars.UPD_SECURITY_REMEDIATION_ENABLED == 'true'
    uses: ./.github/workflows/dependency-remediation.yml
    with:
      publish: >-
        ${{ (github.event_name == 'schedule' &&
             vars.UPD_SECURITY_REMEDIATION_ENABLED == 'true') ||
            (github.event_name == 'workflow_dispatch' && inputs.publish) }}
      langs: rust
      allowed-paths: Cargo.toml Cargo.lock
      validation-command: make check
      branch: security/upd
      commit-message: "fix(deps): remediate vulnerable Rust dependencies with upd"
      app-client-id: ${{ vars.UPD_APP_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.UPD_APP_PRIVATE_KEY }}
