name: Security audit with upd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up toolchain manager
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          install: false

      - name: Install Rust
        run: mise install rust

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-security-audit-${{ hashFiles('Cargo.lock') }}

      - name: Build upd from this revision
        run: cargo build --locked --bin upd

      - name: Audit repository dependencies
        id: audit
        shell: bash
        run: |
          set +e
          target/debug/upd audit --format sarif . > upd-audit.sarif
          audit_exit=$?
          set -e

          if [[ ! -s upd-audit.sarif ]]; then
            echo "upd did not produce a SARIF report" >&2
            exit 5
          fi

          echo "exit-code=$audit_exit" >> "$GITHUB_OUTPUT"

      - name: Upload audit results to code scanning
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: upd-audit.sarif
          category: upd-dependency-audit

      - name: Enforce audit result
        if: always()
        env:
          AUDIT_EXIT: ${{ steps.audit.outputs.exit-code }}
        shell: bash
        run: |
          case "$AUDIT_EXIT" in
            0) exit 0 ;;
            6)
              echo "upd found vulnerable dependencies; review the uploaded SARIF results." >&2
              exit 1
              ;;
            '')
              echo "upd did not complete the audit." >&2
              exit 1
              ;;
            *)
              echo "upd audit failed with exit code $AUDIT_EXIT." >&2
              exit "$AUDIT_EXIT"
              ;;
          esac
