name: Review trusted dependency proposal

on:
  workflow_call:
    inputs:
      allowed-paths:
        description: Explicit dependency-file paths eligible for automatic review
        required: true
        type: string
      publisher-bot-id:
        description: Numeric GitHub identity of the isolated publisher App bot
        required: true
        type: number

permissions:
  actions: read
  contents: read
  pull-requests: write

# Serialize with the trusted publisher so it cannot replace deps/upd mid-review.
concurrency:
  group: upd-dependency-writes-${{ github.repository }}
  cancel-in-progress: false

jobs:
  review:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # No checkout, repository code, or dependency install runs with this token.
      - name: Review the exact compatible proposal from the successful upd run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UPD_ALLOWED_PATHS: ${{ inputs.allowed-paths }}
          UPD_PUBLISHER_BOT_ID: ${{ inputs.publisher-bot-id }}
          UPD_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          python3 - <<'PY_REVIEW'
          import base64
          from collections import Counter
          import tomllib
          import hashlib
          import io
          import json
          import os
          from pathlib import PurePosixPath
          import re
          import subprocess
          import zipfile
          from urllib.parse import quote, urlsplit

          TRUSTED_UPD_SHA = "b183939ff7dc62539afb00b3c555ffbfe3c5d58b"
          UPD_BOT_ID = int(os.environ.get('UPD_PUBLISHER_BOT_ID', '322216747'))
          MAX_ARCHIVE = 16 * 1024 * 1024
          REVIEW_PATHS = {os.environ.get('GH_REPO', ''): os.environ.get('UPD_ALLOWED_PATHS', '').split()}


          class ManualReview(ValueError):
              """The proposal is genuine but outside automatic approval; a person decides."""


          def api(path, payload=None, method="POST"):
              args = ["gh", "api", path]
              if payload is not None:
                  args += ["--method", method, "--input", "-"]
              result = subprocess.run(args, input=None if payload is None else json.dumps(payload),
                                      capture_output=True, text=True, check=True)
              return json.loads(result.stdout) if result.stdout.strip() else None


          def archive(repo, artifact):
              if artifact["expired"] or artifact["size_in_bytes"] > MAX_ARCHIVE:
                  raise ValueError("artifact is expired or too large")
              command = ["gh", "api", f"repos/{repo}/actions/artifacts/{artifact['id']}/zip"]
              # New gh versions sanitize escapes unless explicitly allowed; older versions
              # already pass binary responses through and do not recognize this flag.
              help_text = subprocess.run(["gh", "api", "--help"], capture_output=True, text=True, check=True).stdout
              if "--allow-escape-sequences" in help_text:
                  command.append("--allow-escape-sequences")
              data = subprocess.run(command, capture_output=True, check=True).stdout
              if artifact.get("digest") != "sha256:" + hashlib.sha256(data).hexdigest():
                  raise ValueError("artifact differs from GitHub's recorded digest")
              if len(data) > MAX_ARCHIVE:
                  raise ValueError("archive exceeds size bound")
              with zipfile.ZipFile(io.BytesIO(data)) as zipped:
                  entries = zipped.infolist()
                  if len({e.filename for e in entries}) != len(entries) or sum(e.file_size for e in entries) > MAX_ARCHIVE:
                      raise ValueError("duplicate or oversized archive entries")
                  return {e.filename: zipped.read(e) for e in entries}


          def proposal_head(files, base):
              if set(files) != {"upd-proposal.bundle", "upd-proposal.bundle.sha256"}:
                  raise ValueError("unexpected proposal files")
              bundle = files["upd-proposal.bundle"]
              checksum = files["upd-proposal.bundle.sha256"].decode("ascii").strip()
              if checksum != hashlib.sha256(bundle).hexdigest() + "  upd-proposal.bundle":
                  raise ValueError("proposal checksum mismatch")
              header = bundle.split(b"\n\n", 1)[0].decode("utf-8")
              if not header.startswith("# v2 git bundle\n"):
                  raise ValueError("unsupported bundle format")
              prerequisites = re.findall(r"^-([a-f0-9]{40})(?: .*)?$", header, re.M)
              heads = re.findall(r"^([a-f0-9]{40}) HEAD$", header, re.M)
              if prerequisites != [base] or len(heads) != 1 or len(header.splitlines()) != 3:
                  raise ValueError("proposal does not identify the triggering base and one head")
              return heads[0]


          # Independent, deliberately conservative checks on GitHub's stored blobs. Reports
          # from a job that runs dependency code are evidence, never the sole authority.
          def compatible(before, after, allow_equal=False):
              """Whether `after` is a newer version of the same compatibility line. Equal
              versions only pass when the caller compares everything else itself, since a
              pin that changes while its version stays put is not a version bump. Build
              metadata is not accepted: it would let a different artifact keep its version."""
              pattern = r'([~^=]?)[vV]?([0-9]+)\.([0-9]+)\.([0-9]+)'
              left, right = re.fullmatch(pattern, before, re.ASCII), re.fullmatch(pattern, after, re.ASCII)
              if not left or not right or left[1] != right[1]:
                  return False
              a, b = tuple(map(int, left.groups()[1:])), tuple(map(int, right.groups()[1:]))
              if a == b and not allow_equal:
                  return False
              return b >= a and a[0] == b[0] and (a[0] != 0 or (a[1] == b[1] and (a[1] != 0 or a[2] == b[2])))


          def same(a, b):
              """Structural equality that keeps JSON/TOML types apart (1 is not true)."""
              if type(a) is not type(b):
                  return False
              if isinstance(a, dict):
                  return a.keys() == b.keys() and all(same(v, b[k]) for k, v in a.items())
              if isinstance(a, list):
                  return len(a) == len(b) and all(same(x, y) for x, y in zip(a, b))
              return a == b


          def strict_json(text):
              def refuse(constant):
                  raise ValueError(f'non-standard JSON constant: {constant}')
              def unique(pairs):
                  keys = [k for k, _ in pairs]
                  if len(set(keys)) != len(keys):
                      raise ValueError('duplicate JSON key')
                  return dict(pairs)
              return json.loads(text, parse_constant=refuse, object_pairs_hook=unique)


          def dependency_map(old, new):
              return (isinstance(old, dict) and isinstance(new, dict) and old.keys() == new.keys()
                      and all(same(a, new[k]) or (isinstance(a, str) and isinstance(new[k], str)
                              and compatible(a, new[k])) for k, a in old.items()))


          def json_manifest(old, new):
              if not isinstance(old, dict) or not isinstance(new, dict):
                  return False
              old, new = dict(old), dict(new)
              for key in ['dependencies', 'devDependencies', 'peerDependencies', 'optionalDependencies']:
                  if not dependency_map(old.pop(key, {}), new.pop(key, {})):
                      return False
              return same(old, new)


          BLOCK_HEADER = re.compile(r'(?P<lead>[ ]*(?:-[ ]+)*)(?P<key>(?:[^\s#][^#]*?:[ ]+)?)(?:[&!]\S*[ ]+)*[|>][0-9+-]*[ \t]*(?:#.*)?')
          KEY_LINE = re.compile(r'(?:"(?:[^"\\]|\\.)*"|\'(?:[^\']|\'\')*\'|[^\s:#\'"\[\]{},&*!|>%@`?-][^#]*?):(?:[ ]+(?P<value>.*))?')


          def flow_depth(text):
              """Brackets a line leaves open, ignoring quoted text and comments; None when
              a quote is left unclosed on the line."""
              text = re.sub(r'"(?:[^"\\]|\\.)*"|\'(?:[^\']|\'\')*\'', '', text)
              text = re.sub(r'(^|[ \t])#.*', '', text)
              if '"' in text or "'" in text:
                  return None
              return sum(text.count(c) for c in '[{') - sum(text.count(c) for c in ']}')


          def plain_structure(text):
              """Describe a line that is one complete key, sequence item or comment.

              Returns None when it is not, else a pair: the column a continuation line
              would have to be indented past (-1 when the line holds no scalar value),
              and the number of flow brackets the line leaves open."""
              match = re.fullmatch(r'([ ]*)((?:-[ ]+)*)(.*?)[ \t]*', text)
              indent, lead, rest = len(match[1]), match[2], match[3]
              if not rest or rest == '-':
                  return -1, 0
              column = indent + len(lead)
              key = KEY_LINE.fullmatch(rest)
              if key:
                  rest = key['value'] or ''
                  if not rest or rest.startswith('#'):
                      return -1, 0
              elif lead:
                  column = indent + len(lead.rstrip()) - 1
              else:
                  return None
              if rest.startswith('"'):
                  ok = re.fullmatch(r'"(?:[^"\\]|\\.)*"[ \t]*(?:#.*)?', rest) is not None
              elif rest.startswith("'"):
                  ok = re.fullmatch(r"'(?:[^']|'')*'[ \t]*(?:#.*)?", rest) is not None
              elif rest[:1] in '[{':
                  depth = flow_depth(rest)
                  return (column, depth) if depth is not None and depth >= 0 else None
              else:
                  ok = True
              return (column, 0) if ok else None


          def block_scalar_lines(lines):
              """Numbers of the lines inside block scalars, or None when the layout is ambiguous.

              Only lines that are one complete key, sequence item, comment or block scalar
              are understood, and a flow collection may span lines; a tab in the indentation, a
              multi-line plain or quoted scalar, or anything else makes the whole document
              ambiguous."""
              inside, parent, scalar, flow = set(), None, -1, 0
              for number, line in enumerate(lines):
                  if re.match(r'[ ]*\t', line):
                      return None
                  stripped = line.strip()
                  indent = len(line) - len(line.lstrip(' '))
                  if flow:
                      change = flow_depth(line)
                      if change is None or flow + change < 0:
                          return None
                      flow += change
                      inside.add(number)
                      continue
                  if parent is not None:
                      if not stripped or indent > parent:
                          inside.add(number)
                          continue
                      parent = None
                  if not stripped or stripped.startswith('#') or stripped in ('---', '...'):
                      continue
                  if indent > scalar >= 0:
                      return None
                  header = BLOCK_HEADER.fullmatch(line)
                  if header:
                      # A header alone on its line belongs to a node on an earlier line,
                      # so where its body starts is not known.
                      if not header['key'] and '-' not in header['lead']:
                          return None
                      parent = len(header['lead']) if header['key'] else indent
                      scalar = -1
                  else:
                      described = plain_structure(line)
                      if described is None:
                          return None
                      scalar, flow = described
              return inside



          def same_tarball(old_url, old_version, new_url, new_version):
              """Compare resolved URLs part by part: scheme, host, directories, query and
              fragment must match, and only the version inside the file name may differ."""
              if not isinstance(old_url, str) or not isinstance(new_url, str):
                  return False
              if not old_url and not new_url:
                  return True
              try:
                  a, b = urlsplit(old_url), urlsplit(new_url)
              except ValueError:
                  return False
              if not a.scheme or not a.netloc or (a.scheme, a.netloc, a.query, a.fragment) != (b.scheme, b.netloc, b.query, b.fragment):
                  return False
              old_path, new_path = a.path.split('/'), b.path.split('/')
              if len(old_path) != len(new_path) or old_path[:-1] != new_path[:-1]:
                  return False
              return old_path[-1].replace(old_version, '{version}') == new_path[-1].replace(new_version, '{version}')


          SUBRESOURCE_DIGEST_LENGTHS = {'sha256': 44, 'sha384': 64, 'sha512': 88}


          def subresource_algorithm(value):
              """The algorithm of a single well-formed `<algorithm>-<base64 digest>` integrity
              string, else None."""
              match = re.fullmatch(r'(sha256|sha384|sha512)-([A-Za-z0-9+/]+={0,2})', value, re.ASCII) if isinstance(value, str) else None
              return match[1] if match and len(match[2]) == SUBRESOURCE_DIGEST_LENGTHS[match[1]] else None


          def lock_record(old, new, tree=False):
              """Compare one lockfile record: only a compatible version bump may differ, with
              the tarball URL following the version. In a v2 `dependencies` tree the nested
              records and the `requires` ranges follow the same rules."""
              if not isinstance(old, dict) or not isinstance(new, dict):
                  return False
              left, right = dict(old), dict(new)
              if same(left, right):
                  return True
              av, bv = left.get('version'), right.get('version')
              if not isinstance(av, str) or not isinstance(bv, str) or not compatible(av, bv, allow_equal=True):
                  return False
              for field in ['resolved', 'integrity']:
                  if left.get(field) != right.get(field) and av == bv:
                      return False
              # A changed hash must stay a well-formed hash of the same algorithm; it can
              # be neither dropped nor weakened.
              if left.get('integrity') != right.get('integrity'):
                  algorithms = [subresource_algorithm(r.get('integrity')) for r in (left, right)]
                  if None in algorithms or algorithms[0] != algorithms[1]:
                      return False
              # Preserve the registry and package identity, allowing only the version
              # component in the tarball URL to change.
              if not same_tarball(left.get('resolved', ''), av, right.get('resolved', ''), bv):
                  return False
              for field in ['version', 'resolved', 'integrity']:
                  left.pop(field, None)
                  right.pop(field, None)
              if not tree:
                  return json_manifest(left, right)
              if not dependency_map(left.pop('requires', {}), right.pop('requires', {})):
                  return False
              return lock_tree(left.pop('dependencies', {}), right.pop('dependencies', {})) and same(left, right)


          def lock_tree(old, new):
              return (isinstance(old, dict) and isinstance(new, dict) and old.keys() == new.keys()
                      and all(isinstance(old[k], dict) and isinstance(new[k], dict)
                              and lock_record(old[k], new[k], tree=True) for k in old))


          def tree_matches_packages(tree, packages, prefix=''):
              """Every record of a v2 `dependencies` tree must agree with the `packages` record
              at the same path on version, tarball and integrity."""
              for name, record in tree.items():
                  path = prefix + 'node_modules/' + name
                  entry = packages.get(path)
                  if not isinstance(entry, dict) or any(entry.get(f) != record.get(f) for f in ('version', 'resolved', 'integrity')):
                      return False
                  if not tree_matches_packages(record.get('dependencies', {}), packages, path + '/'):
                      return False
              return True


          def content_compatible(path, before, after):
              """Whether the edit is a pure compatible bump. A file whose shape the
              classifier does not expect is not one, so it declines rather than fails."""
              try:
                  return classify_content(path, before, after)
              except (TypeError, AttributeError, KeyError, IndexError, ValueError):
                  return False


          def classify_content(path, before, after):
              if path.startswith('.github/workflows/'):
                  # YAML breaks lines on \n, \r\n and \r only. Every other separator that
                  # str.splitlines() honors may be script text, so it is never split on and
                  # makes the file ambiguous.
                  if re.search('[\x0b\x0c\x1c\x1d\x1e\x85\u2028\u2029]', before + after):
                      return False
                  old, new = before.split('\n'), after.split('\n')
                  if len(old) != len(new) or any('\r' in line[:-1] for line in old + new):
                      return False
                  # Both sides must end every line the same way; the \r of a CRLF is then dropped.
                  if [line.endswith('\r') for line in old] != [line.endswith('\r') for line in new]:
                      return False
                  old, new = [line.removesuffix('\r') for line in old], [line.removesuffix('\r') for line in new]
                  inside_old, inside_new = block_scalar_lines(old), block_scalar_lines(new)
                  if inside_old is None or inside_new is None:
                      return False
                  action = re.compile(r'(\s*(?:-\s*)?uses:\s*)([A-Za-z0-9_.-]+/[A-Za-z0-9_./-]+)@([a-f0-9]{40})[ \t]+#[ \t]*(v[0-9]+\.[0-9]+\.[0-9]+)[ \t]*', re.ASCII)
                  for number, (a, b) in enumerate(zip(old, new)):
                      if a == b:
                          continue
                      if number in inside_old or number in inside_new:
                          return False
                      left, right = action.fullmatch(a), action.fullmatch(b)
                      if (not left or not right or left.group(1, 2) != right.group(1, 2)
                              or not compatible(left[4], right[4])):
                          return False
                  return True
              if path.endswith('package.json'):
                  return json_manifest(strict_json(before), strict_json(after))
              if path.endswith('package-lock.json'):
                  old, new = strict_json(before), strict_json(after)
                  if not isinstance(old, dict) or not isinstance(new, dict):
                      return False
                  a, b = old.pop('packages', {}), new.pop('packages', {})
                  # Lockfile v2 repeats every record under a top-level `dependencies` tree.
                  legacy_a, legacy_b = old.pop('dependencies', {}), new.pop('dependencies', {})
                  if (not same(old, new) or not isinstance(a, dict) or not isinstance(b, dict)
                          or not isinstance(legacy_a, dict) or not isinstance(legacy_b, dict)
                          or not a or a.keys() != b.keys()):
                      return False
                  for key, value in a.items():
                      if not key:
                          if not json_manifest(value, b[key]):
                              return False
                      elif not lock_record(value, b[key]):
                          return False
                  return lock_tree(legacy_a, legacy_b) and tree_matches_packages(legacy_b, b)
              if path.endswith('Cargo.toml'):
                  def deps(a, b):
                      if not isinstance(a, dict) or not isinstance(b, dict) or a.keys() != b.keys():
                          return False
                      for key, value in a.items():
                          other = b[key]
                          if same(value, other):
                              continue
                          if isinstance(value, str) and isinstance(other, str):
                              if not compatible(value, other):
                                  return False
                          elif isinstance(value, dict) and isinstance(other, dict):
                              x, y = dict(value), dict(other)
                              av, bv = x.pop('version', ''), y.pop('version', '')
                              if not same(x, y) or not compatible(av, bv):
                                  return False
                          else:
                              return False
                      return True
                  def manifest(a, b, path=()):
                      if same(a, b):
                          return True
                      if not isinstance(a, dict) or not isinstance(b, dict) or a.keys() != b.keys():
                          return False
                      # Only real dependency tables are compared as dependencies: the top
                      # level, [workspace], and [target.<cfg>]. A table that merely shares
                      # the name (package.metadata.dependencies) must not change at all.
                      scope = path in {(), ('workspace',)} or (len(path) == 2 and path[0] == 'target')
                      return all((deps(a[k], b[k]) if scope and k in {'dependencies', 'dev-dependencies', 'build-dependencies'}
                                  else manifest(a[k], b[k], path + (k,))) for k in a)
                  return manifest(tomllib.loads(before), tomllib.loads(after))
              if path.endswith('Cargo.lock'):
                  a, b = tomllib.loads(before), tomllib.loads(after)
                  ap, bp = a.pop('package', []), b.pop('package', [])
                  if not same(a, b) or not ap or len(ap) != len(bp):
                      return False
                  # Stable sorting pairs multiple installed versions of the same crate.
                  order = lambda p: (p['name'], p.get('source', ''), tuple(map(int, re.match(r'^([0-9]+)\.([0-9]+)\.([0-9]+)', p['version'], re.ASCII).groups())) + (p['version'],))
                  for x, y in zip(sorted(ap, key=order), sorted(bp, key=order)):
                      left, right = dict(x), dict(y)
                      if same(left, right):
                          continue
                      av, bv = left['version'], right['version']
                      if not compatible(av, bv, allow_equal=True) or (av == bv and left.get('checksum') != right.get('checksum')):
                          return False
                      for field in ['version', 'checksum']:
                          left.pop(field, None)
                          right.pop(field, None)
                      # Cargo may rewire a reference to another already-installed version.
                      # No source, crate identity, metadata, or dependency names can change.
                      ad, bd = left.pop('dependencies', []), right.pop('dependencies', [])
                      if not same(left, right) or [s.split()[0] for s in ad] != [s.split()[0] for s in bd]:
                          return False
                      known = {(p['name'], p['version']) for p in ap + bp}
                      if any(len(s.split()) > 1 and tuple(s.split()[:2]) not in known for s in bd):
                          return False
                  return True
              if path.endswith('go.mod'):
                  old, new = go_mod_entries(before), go_mod_entries(after)
                  if [e[:2] for e in old] != [e[:2] for e in new]:
                      return False
                  # The module path before the version and the whole tail after it, a
                  # comment included, must stay byte-identical; only the version token changes.
                  require = re.compile(r'(\s*(?:require\s+)?[A-Za-z0-9._~/-]+\s+)(v[0-9]+\.[0-9]+\.[0-9]+)(\+incompatible)?([ \t\r]*(?://.*)?)', re.ASCII)
                  for (verb, role, a), (_, _, b) in zip(old, new):
                      if a == b:
                          continue
                      # Only a version in a `require` directive is a dependency bump; every
                      # other directive (exclude, replace, retract, tool, ...) must not change.
                      left, right = require.fullmatch(a), require.fullmatch(b)
                      if (verb != 'require' or role not in {'stmt', 'member'} or not left or not right
                              or left.group(1, 3, 4) != right.group(1, 3, 4) or not compatible(left[2], right[2])):
                          return False
                  return True
              if path.endswith('go.sum'):
                  # Blank lines are part of the file's bytes; they are not rows to pair up.
                  blank = lambda text: sum(1 for line in text.split('\n') if not line.strip())
                  if blank(before) != blank(after):
                      return False
                  try:
                      old, new = Counter(go_sum_records(before)), Counter(go_sum_records(after))
                  except ValueError:
                      return False
                  # Rows present on both sides are untouched; the rest must pair up
                  # per module and per /go.mod suffix as version bumps.
                  removed, added = old - new, new - old

                  def grouped(rows):
                      result = {}
                      for module, version, checksum in rows.elements():
                          suffix = '/go.mod' if version.endswith('/go.mod') else ''
                          result.setdefault((module, suffix), []).append((version.removesuffix('/go.mod'), checksum))
                      return {k: sorted(v, key=lambda r: (semver_key(r[0]), r[1])) for k, v in result.items()}
                  try:
                      a, b = grouped(removed), grouped(added)
                  except ValueError:
                      return False
                  return a.keys() == b.keys() and all(len(a[k]) == len(b[k]) and all(
                      x[0] != y[0] and compatible(x[0], y[0]) for x, y in zip(a[k], b[k])) for k in a)
              # Unsupported edits keep their normal human review requirement.
              return False


          GO_TOKEN = re.compile(r'//[^\n]*|"(?:\\.|[^"\\])*"|`[^`]*`|=>|[()\[\],]|(?:(?!//|=>)[^\s()\[\],"`])+')
          # Operand counts per go.mod directive, as golang.org/x/mod/modfile enforces them.
          GO_MOD_VERBS = {'module': 1, 'go': 1, 'toolchain': 1, 'godebug': 1, 'tool': 1, 'ignore': 1,
                          'require': 2, 'exclude': 2, 'replace': None, 'retract': None}
          GO_MOD_SINGLE = {'module', 'go', 'toolchain'}
          GO_SPACE = re.compile(r'[\t\n\v\f\r \x85\xa0\u1680\u2000-\u200a\u2028\u2029\u202f\u205f\u3000]+')


          def go_mod_tokens(line):
              tokens, position = [], 0
              while position < len(line):
                  if line[position] in ' \t\r':
                      position += 1
                      continue
                  match = GO_TOKEN.match(line, position)
                  if not match:
                      raise ValueError('unexpected character')
                  if match.group().startswith('//'):
                      break
                  tokens.append(match.group())
                  position = match.end()
              return tokens


          def go_mod_arguments_ok(verb, args):
              if verb == 'replace':
                  if args.count('=>') != 1:
                      return False
                  split = args.index('=>')
                  left, right = args[:split], args[split + 1:]
                  return len(left) in {1, 2} and len(right) in {1, 2} and not {'(', ')', ',', '[', ']'} & set(args)
              if verb == 'retract':
                  if len(args) == 1:
                      return args[0] not in {'(', ')', ',', '[', ']', '=>'}
                  return len(args) == 5 and args[0] == '[' and args[2] == ',' and args[4] == ']'
              return (len(args) == GO_MOD_VERBS[verb]
                      and not {'(', ')', ',', '[', ']', '=>'} & set(args))


          def go_mod_entries(text):
              """Parse go.mod as Go does and return (directive, role, line) per physical line.

              The role is stmt, open, member, close or blank, so a caller can tell which
              directive a block line belongs to. Anything Go would reject raises."""
              entries, block, seen = [], None, set()
              for number, line in enumerate(text.split('\n'), 1):
                  def fail(reason):
                      return ValueError(f'go.mod line {number}: {reason}')
                  try:
                      tokens = go_mod_tokens(line)
                  except ValueError as problem:
                      raise fail(str(problem)) from None
                  if not tokens:
                      entries.append((block or '', 'blank', line))
                  elif block:
                      if tokens == [')']:
                          entries.append((block, 'close', line))
                          block = None
                      elif go_mod_arguments_ok(block, tokens):
                          entries.append((block, 'member', line))
                      else:
                          raise fail(f'malformed {block} entry')
                  else:
                      verb, args = tokens[0], tokens[1:]
                      if verb not in GO_MOD_VERBS:
                          raise fail('unknown directive')
                      if args == ['(']:
                          if verb in {'go', 'toolchain'}:
                              raise fail(f'{verb} cannot be a block')
                          block = verb
                          entries.append((verb, 'open', line))
                          continue
                      if not go_mod_arguments_ok(verb, args):
                          raise fail(f'malformed {verb} directive')
                      if verb in GO_MOD_SINGLE:
                          if verb in seen:
                              raise fail(f'repeated {verb} directive')
                          seen.add(verb)
                      entries.append((verb, 'stmt', line))
              if block:
                  raise ValueError('go.mod has an unclosed block')
              return entries


          def parse_go_mod(text):
              go_mod_entries(text)


          def go_sum_records(text):
              """Yield (module, version, checksum) per go.sum line, split as Go splits it:
              on newlines only, then on Unicode white space."""
              for number, line in enumerate(text.split('\n'), 1):
                  fields = [f for f in GO_SPACE.split(line) if f]
                  if not fields:
                      continue
                  if len(fields) != 3 or not fields[1].startswith('v') or not fields[2].startswith('h1:'):
                      raise ValueError(f'go.sum line {number}: malformed entry')
                  yield tuple(fields)


          def parse_go_sum(text):
              list(go_sum_records(text))


          def semver_key(version):
              match = re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-([0-9A-Za-z.-]+))?(?:\+[0-9A-Za-z.-]+)?', version, re.ASCII)
              if not match:
                  raise ValueError(f'not a semantic version: {version}')
              pre = match[4]
              identifiers = tuple((0, int(i), '') if i.isdigit() else (1, 0, i) for i in pre.split('.')) if pre else ()
              return (int(match[1]), int(match[2]), int(match[3]), pre is None, identifiers, version)


          def parse_document(path, text):
              """Fully parse a changed file whatever its status or classification.

              Workflow YAML has no stdlib parser; a modified workflow is held to
              line-for-line `uses:` replacements by content_compatible, so every other
              line is byte-identical to a file GitHub already accepted."""
              if path.endswith('.json'):
                  strict_json(text)
              elif path.endswith('.toml') or path.endswith('Cargo.lock'):
                  tomllib.loads(text)
              elif path.endswith('go.mod'):
                  parse_go_mod(text)
              elif path.endswith('go.sum'):
                  parse_go_sum(text)


          def verify_contents(get, repo, base, head, files):
              """Read and parse every changed file, then classify it.

              Parsing is unconditional and comes first: a malformed file raises a hard
              ValueError whatever its status or whatever another file needs. Returns the
              reasons a person must review."""
              def read(path, ref):
                  blob = get(f"repos/{repo}/contents/{quote(path, safe='/')}?ref={ref}")
                  if blob.get('encoding') != 'base64' or blob.get('size', MAX_ARCHIVE + 1) > MAX_ARCHIVE:
                      raise ValueError('unsupported or oversized GitHub blob')
                  return base64.b64decode(blob['content'], validate=False).decode('utf-8')
              documents = []
              for file in files:
                  path = file['filename']
                  after = read(path, head)
                  parse_document(path, after)
                  if file['status'] == 'added' and path.endswith(('.yml', '.yaml')):
                      # The standard library cannot parse YAML, so a new YAML file cannot be
                      # shown well-formed. It is an integrity failure rather than a notice
                      # for a person, who would have no signal that the file is broken.
                      raise ValueError(f'added YAML file cannot be validated: {path}')
                  before = None
                  if file['status'] == 'modified':
                      before = read(path, base)
                      parse_document(path, before)
                  documents.append((file, before, after))
              reasons = []
              for file, before, after in documents:
                  path = file['filename']
                  if file['status'] != 'modified':
                      reasons.append('new dependency files require manual review')
                  elif not content_compatible(path, before, after):
                      reasons.append(f'file requires manual compatibility review: {path}')
              return reasons


          def candidate(pr, repo, branch, head, armed=True):
              return (pr.get("state") == "open" and not pr.get("draft")
                      and pr.get("user", {}).get("id") == UPD_BOT_ID
                      and pr.get("user", {}).get("type") == "Bot"
                      and pr.get("base", {}).get("ref") == branch
                      and pr.get("base", {}).get("repo", {}).get("full_name") == repo
                      and pr.get("head", {}).get("ref") == "deps/upd"
                      and pr.get("head", {}).get("repo", {}).get("full_name") == repo
                      and pr.get("head", {}).get("sha") == head
                      and (not armed or (
                          (pr.get("auto_merge") or {}).get("merge_method") == "squash"
                          and (pr.get("auto_merge") or {}).get("enabled_by", {}).get("id") == UPD_BOT_ID)))


          def trusted_revision(get, reference):
              match = re.fullmatch(r"rvben/upd/\.github/workflows/dependency-health\.yml@([a-f0-9]{40})", reference.get("path", ""))
              if not match or reference.get("sha") != match[1]:
                  return False
              if match[1] == TRUSTED_UPD_SHA:
                  return True
              # Future stable releases must be published by the same upstream and resolve
              # to this exact commit. Branch refs, prereleases, and older guards are denied.
              for tag in get("repos/rvben/upd/tags?per_page=100"):
                  version = re.fullmatch(r"v([0-9]+)\.([0-9]+)\.([0-9]+)", tag["name"], re.ASCII)
                  if (version and tuple(map(int, version.groups())) >= (0, 18, 2)
                          and tag["commit"]["sha"] == match[1]):
                      release = get("repos/rvben/upd/releases/tags/" + tag["name"])
                      return (release.get("tag_name") == tag["name"] and not release.get("draft", True)
                              and not release.get("prerelease", True) and bool(release.get("published_at")))
              return False


          def dismiss_stale(get, repo, branch):
              prs = get(f"repos/{repo}/pulls?state=open&head={repo.split('/')[0]}:deps/upd&base={quote(branch, safe='')}&per_page=100")
              for pr in prs:
                  if pr.get('user', {}).get('id') != UPD_BOT_ID:
                      continue
                  for page in range(1, 101):
                      reviews = get(f"repos/{repo}/pulls/{pr['number']}/reviews?per_page=100&page={page}")
                      for item in reviews:
                          if ((item.get('user') or {}).get('login') == 'github-actions[bot]'
                                  and item.get('state') == 'APPROVED'
                                  and item.get('commit_id') != pr['head']['sha']):
                              get(f"repos/{repo}/pulls/{pr['number']}/reviews/{item['id']}/dismissals", {
                                  'message': 'Withdrawing approval of an older rolling proposal.'
                              }, method='PUT')
                      if len(reviews) < 100:
                          break
                  else:
                      raise ValueError('review history exceeds safety bound')


          def verify_rules(get, repo, branch):
              # Approval prerequisites: only needed when something is going to be approved.
              rules = get(f"repos/{repo}/rules/branches/{quote(branch, safe='')}")
              if not any(r['type'] == 'pull_request'
                         and r.get('parameters', {}).get('dismiss_stale_reviews_on_push') is True
                         and r.get('parameters', {}).get('required_approving_review_count', 0) >= 1 for r in rules):
                  raise ValueError('automatic approval requires a stale-dismissal review ruleset')
              if not any(r['type'] == 'required_status_checks'
                         and r.get('parameters', {}).get('strict_required_status_checks_policy') is True
                         and r.get('parameters', {}).get('required_status_checks')
                         and all(isinstance(c.get('integration_id'), int) and c['integration_id'] > 0
                                 for c in r['parameters']['required_status_checks']) for r in rules):
                  raise ValueError('automatic approval requires strict required CI checks')


          def verify_lineage(get, repo, branch, base, head):
              # A dispatch on a tag named like the default branch must not introduce an
              # unreviewed parent. Bind to the actual branch ref, not its ambiguous name.
              tip = get(f"repos/{repo}/git/ref/heads/{quote(branch, safe='')}")['object']['sha']
              if get(f"repos/{repo}/compare/{base}...{tip}")['status'] not in {'identical', 'ahead'}:
                  raise ValueError('triggering base is not on the protected default branch')
              if get(f"repos/{repo}/compare/{tip}...{head}").get('merge_base_commit', {}).get('sha') != base:
                  raise ValueError('pull request merge base differs from the validated base')


          def verify_pr_integrity(get, repo, branch, base, head, number, files):
              verify_lineage(get, repo, branch, base, head)
              actual = get(f"repos/{repo}/pulls/{number}/files?per_page=100")
              identity = lambda rows: sorted((f['filename'], f['status'], f['sha']) for f in rows)
              if len(actual) >= 100 or identity(actual) != identity(files):
                  raise ValueError('pull request diff differs from the validated proposal')


          def verify_merge_scope(get, repo, branch, base, head, number, files):
              verify_rules(get, repo, branch)
              verify_pr_integrity(get, repo, branch, base, head, number, files)


          def review(repo, run_id, get=api, download=archive):
              if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo) or not str(run_id).isdigit():
                  raise ValueError("invalid repository or run")
              if repo not in REVIEW_PATHS:
                  raise ValueError("repository has not opted in to this review policy")
              metadata = get(f"repos/{repo}")
              branch = metadata["default_branch"]
              dismiss_stale(get, repo, branch)
              run = get(f"repos/{repo}/actions/runs/{run_id}")
              if (run["status"] != "completed" or run["conclusion"] != "success"
                      or run["event"] not in {"schedule", "workflow_dispatch"}
                      or run["head_repository"]["full_name"] != repo
                      or run["head_branch"] != branch
                      or run["path"] != ".github/workflows/dependencies.yml"):
                  raise ValueError("run is not a successful trusted default-branch updater")
              base = run["head_sha"]
              if not re.fullmatch(r"[a-f0-9]{40}", base):
                  raise ValueError("invalid run base")
              # GitHub resolves the actual referenced reusable workflow, independent of
              # anything the repository-controlled update/validation commands can write.
              references = run.get("referenced_workflows", [])
              if len(references) != 1 or not trusted_revision(get, references[0]):
                  raise ValueError("run did not use the reviewed compatibility guard")
              jobs = get(f"repos/{repo}/actions/runs/{run_id}/jobs?per_page=100")["jobs"]
              if not jobs or len(jobs) > 2 or any(j["name"] not in {"update / update", "update / publish"} for j in jobs):
                  raise ValueError("unexpected jobs in the trusted updater run")
              publishers = [j for j in jobs if j["name"] == "update / publish"]
              if len(publishers) == 1 and publishers[0]["conclusion"] == "skipped":
                  print("No proposal was published by this run.")
                  return
              if len(publishers) == 1 and publishers[0]["conclusion"] == "success" and any(
                      s["name"] == "Publish rolling pull request" and s["conclusion"] == "skipped"
                      for s in publishers[0]["steps"]):
                  print("No proposal was published by this run.")
                  return
              required_steps = {"Enforce publisher proposal policy", "Publish rolling pull request"}
              if len(publishers) != 1 or publishers[0]["conclusion"] != "success" or not required_steps.issubset(
                      {s["name"] for s in publishers[0]["steps"] if s["conclusion"] == "success"}):
                  raise ValueError("isolated publisher did not validate and publish this proposal")
              artifacts = get(f"repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100")["artifacts"]
              def evidence(name):
                  matches = [a for a in artifacts if a["name"] == name and not a["expired"]
                             and a["workflow_run"]["id"] == int(run_id)]
                  if len(matches) != 1:
                      raise ValueError("missing or ambiguous run evidence")
                  return download(repo, matches[0])
              proposal = proposal_head(evidence("upd-proposal"), base)
              # Independently bind the claimed bundle head to GitHub's stored commit graph
              # and the repository's explicit dependency-file scope.
              commit = get(f"repos/{repo}/commits/{proposal}?per_page=100")
              files = commit.get("files", [])
              if (commit.get("sha") != proposal
                      or [p["sha"] for p in commit.get("parents", [])] != [base]
                      or not files or len(files) >= 100
                      or any(f["status"] not in {"modified", "added"} or not any(
                          PurePosixPath('/' + f["filename"]).match('/' + pattern) for pattern in REVIEW_PATHS[repo]) for f in files)):
                  raise ValueError("GitHub commit is not one scoped proposal on the triggering base")
              report = evidence("upd-report")
              presentation = json.loads(report["upd-presentation.json"])
              # Every integrity check runs before any manual-review reason may end the
              # review, so a proposal cannot be declined past a defect it also has.
              verify_lineage(get, repo, branch, base, proposal)
              reasons = []
              if presentation.get("auto_merge_requested") is not True or presentation.get("auto_merge_eligible") is not True:
                  reasons.append("proposal requires manual review")
              reasons += verify_contents(get, repo, base, proposal, files)
              prs = get(f"repos/{repo}/pulls?state=open&head={repo.split('/')[0]}:deps/upd&base={quote(branch, safe='')}&per_page=100")
              # The proposal is found by identity alone: the publisher switches auto-merge
              # off for a proposal that needs a person, and a bot-owned PR with it off is
              # still the published proposal whose integrity must be checked. A proposal
              # with no open PR (merged, closed or replaced since the run) has nothing to
              # verify beyond the lineage and contents checked above.
              matches = [p for p in prs if candidate(p, repo, branch, proposal, armed=False)]
              if not matches:
                  if reasons:
                      raise ManualReview("; ".join(dict.fromkeys(reasons)))
                  print("No current eligible proposal to approve.")
                  return
              if len(matches) != 1:
                  raise ValueError("ambiguous pull request")
              number = matches[0]["number"]
              # Recheck immediately before submission. The approval is attached to the
              # evidence's exact SHA; dismissed stale reviews protect a later replacement.
              current = get(f"repos/{repo}/pulls/{number}")
              if not candidate(current, repo, branch, proposal, armed=False):
                  raise ValueError("pull request changed before review")
              # Integrity checks run on every matched pull request before any exit 0;
              # only then does the decision follow. Approval prerequisites come last.
              verify_pr_integrity(get, repo, branch, base, proposal, number, files)
              if reasons:
                  raise ManualReview("; ".join(dict.fromkeys(reasons)))
              if not candidate(current, repo, branch, proposal):
                  print("No current eligible proposal to approve: auto-merge is not armed.")
                  return
              verify_rules(get, repo, branch)
              posted = get(f"repos/{repo}/pulls/{number}/reviews", {
                  "commit_id": proposal, "event": "APPROVE",
                  "body": "Validated the exact proposal from the trusted upd run: compatible update, isolated publication policy passed. Required CI and code-owner rules still apply."
              })
              after = get(f"repos/{repo}/pulls/{number}")
              if after.get("merged") and after.get("head", {}).get("sha") == proposal:
                  print(f"The approved proposal in PR #{number} has already merged.")
                  return
              try:
                  if posted.get('commit_id') != proposal or posted.get('state') != 'APPROVED':
                      raise ValueError('GitHub review response does not identify the approved proposal')
                  if not candidate(after, repo, branch, proposal):
                      raise ValueError('proposal changed during review')
                  verify_merge_scope(get, repo, branch, base, proposal, number, files)
              except Exception as problem:
                  get(f"repos/{repo}/pulls/{number}/reviews/{posted['id']}/dismissals", {
                      "message": "Proposal or protections changed during approval; discarding this review."
                  }, method="PUT")
                  raise ValueError("proposal changed during review; approval dismissed") from problem
              print(f"Approved the validated proposal in PR #{number} at {proposal}.")


          def main():
              # Declining to approve is the policy working, not a failure: the proposal
              # stays open for a person. Integrity problems (ambiguous evidence, a changed
              # proposal, an untrusted run) still raise and fail the check.
              try:
                  review(os.environ["GH_REPO"], os.environ["UPD_RUN_ID"])
              except ManualReview as decision:
                  message = f"Not approved automatically: {decision}. The proposal needs a human review."
                  annotation = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::notice title=Manual review required::{annotation}")
                  summary = os.environ.get("GITHUB_STEP_SUMMARY")
                  if summary:
                      with open(summary, "a", encoding="utf-8") as out:
                          out.write(f"### Manual review required\n\n{message}\n")


          if __name__ == "__main__":
              main()
          PY_REVIEW
