name: Review trusted dependency proposal

on:
  workflow_call:
    inputs:
      allowed-paths:
        description: Explicit dependency-file paths eligible for automatic review
        required: true
        type: string
      publisher-bot-id:
        description: Numeric GitHub identity of the isolated publisher App bot
        required: true
        type: number

permissions:
  actions: read
  contents: read
  pull-requests: write

# Serialize with the trusted publisher so it cannot replace deps/upd mid-review.
concurrency:
  group: upd-dependency-writes-${{ github.repository }}
  cancel-in-progress: false

jobs:
  review:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # No checkout, repository code, or dependency install runs with this token.
      - name: Review the exact compatible proposal from the successful upd run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UPD_ALLOWED_PATHS: ${{ inputs.allowed-paths }}
          UPD_PUBLISHER_BOT_ID: ${{ inputs.publisher-bot-id }}
          UPD_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          python3 - <<'PY_REVIEW'
          import base64
          import tomllib
          import hashlib
          import io
          import json
          import os
          from pathlib import PurePosixPath
          import re
          import subprocess
          import zipfile
          from urllib.parse import quote

          TRUSTED_UPD_SHA = "b183939ff7dc62539afb00b3c555ffbfe3c5d58b"
          UPD_BOT_ID = int(os.environ.get('UPD_PUBLISHER_BOT_ID', '322216747'))
          MAX_ARCHIVE = 16 * 1024 * 1024
          REVIEW_PATHS = {os.environ.get('GH_REPO', ''): os.environ.get('UPD_ALLOWED_PATHS', '').split()}


          def api(path, payload=None, method="POST"):
              args = ["gh", "api", path]
              if payload is not None:
                  args += ["--method", method, "--input", "-"]
              result = subprocess.run(args, input=None if payload is None else json.dumps(payload),
                                      capture_output=True, text=True, check=True)
              return json.loads(result.stdout) if result.stdout.strip() else None


          def archive(repo, artifact):
              if artifact["expired"] or artifact["size_in_bytes"] > MAX_ARCHIVE:
                  raise ValueError("artifact is expired or too large")
              command = ["gh", "api", f"repos/{repo}/actions/artifacts/{artifact['id']}/zip"]
              # New gh versions sanitize escapes unless explicitly allowed; older versions
              # already pass binary responses through and do not recognize this flag.
              help_text = subprocess.run(["gh", "api", "--help"], capture_output=True, text=True, check=True).stdout
              if "--allow-escape-sequences" in help_text:
                  command.append("--allow-escape-sequences")
              data = subprocess.run(command, capture_output=True, check=True).stdout
              if artifact.get("digest") != "sha256:" + hashlib.sha256(data).hexdigest():
                  raise ValueError("artifact differs from GitHub's recorded digest")
              if len(data) > MAX_ARCHIVE:
                  raise ValueError("archive exceeds size bound")
              with zipfile.ZipFile(io.BytesIO(data)) as zipped:
                  entries = zipped.infolist()
                  if len({e.filename for e in entries}) != len(entries) or sum(e.file_size for e in entries) > MAX_ARCHIVE:
                      raise ValueError("duplicate or oversized archive entries")
                  return {e.filename: zipped.read(e) for e in entries}


          def proposal_head(files, base):
              if set(files) != {"upd-proposal.bundle", "upd-proposal.bundle.sha256"}:
                  raise ValueError("unexpected proposal files")
              bundle = files["upd-proposal.bundle"]
              checksum = files["upd-proposal.bundle.sha256"].decode("ascii").strip()
              if checksum != hashlib.sha256(bundle).hexdigest() + "  upd-proposal.bundle":
                  raise ValueError("proposal checksum mismatch")
              header = bundle.split(b"\n\n", 1)[0].decode("utf-8")
              if not header.startswith("# v2 git bundle\n"):
                  raise ValueError("unsupported bundle format")
              prerequisites = re.findall(r"^-([a-f0-9]{40})(?: .*)?$", header, re.M)
              heads = re.findall(r"^([a-f0-9]{40}) HEAD$", header, re.M)
              if prerequisites != [base] or len(heads) != 1 or len(header.splitlines()) != 3:
                  raise ValueError("proposal does not identify the triggering base and one head")
              return heads[0]


          # Independent, deliberately conservative checks on GitHub's stored blobs. Reports
          # from a job that runs dependency code are evidence, never the sole authority.
          def compatible(before, after):
              pattern = r'([~^=]?)[vV]?(\d+)\.(\d+)\.(\d+)(?:\+[0-9A-Za-z.-]+)?'
              left, right = re.fullmatch(pattern, before), re.fullmatch(pattern, after)
              if not left or not right or left[1] != right[1]:
                  return False
              a, b = tuple(map(int, left.groups()[1:])), tuple(map(int, right.groups()[1:]))
              return b >= a and a[0] == b[0] and (a[0] != 0 or (a[1] == b[1] and (a[1] != 0 or a[2] == b[2])))


          def dependency_map(old, new):
              return (isinstance(old, dict) and isinstance(new, dict) and old.keys() == new.keys()
                      and all(a == new[k] or (isinstance(a, str) and isinstance(new[k], str)
                              and compatible(a, new[k])) for k, a in old.items()))


          def json_manifest(old, new):
              old, new = dict(old), dict(new)
              for key in ['dependencies', 'devDependencies', 'peerDependencies', 'optionalDependencies']:
                  if not dependency_map(old.pop(key, {}), new.pop(key, {})):
                      return False
              return old == new


          def content_compatible(path, before, after):
              if path.startswith('.github/workflows/'):
                  old, new = before.splitlines(), after.splitlines()
                  if len(old) != len(new):
                      return False
                  action = re.compile(r'(\s*(?:-\s*)?uses:\s*)([A-Za-z0-9_.-]+/[A-Za-z0-9_./-]+)@([a-f0-9]{40})[ \t]+#[ \t]*(v\d+\.\d+\.\d+)[ \t]*')
                  for a, b in zip(old, new):
                      if a == b:
                          continue
                      left, right = action.fullmatch(a), action.fullmatch(b)
                      if (not left or not right or left.group(1, 2) != right.group(1, 2)
                              or not compatible(left[4], right[4])):
                          return False
                  return True
              if path.endswith('package.json'):
                  return json_manifest(json.loads(before), json.loads(after))
              if path.endswith('package-lock.json'):
                  old, new = json.loads(before), json.loads(after)
                  a, b = old.pop('packages', {}), new.pop('packages', {})
                  if old != new or not a or a.keys() != b.keys():
                      return False
                  for key, value in a.items():
                      left, right = dict(value), dict(b[key])
                      if not key:
                          if not json_manifest(left, right):
                              return False
                          continue
                      if left == right:
                          continue
                      av, bv = left.get('version'), right.get('version')
                      if not isinstance(av, str) or not isinstance(bv, str) or not compatible(av, bv):
                          return False
                      for field in ['resolved', 'integrity']:
                          if left.get(field) != right.get(field) and av == bv:
                              return False
                      # Preserve the registry and package identity, allowing only the version
                      # component in the tarball URL to change.
                      ar, br = left.get('resolved', ''), right.get('resolved', '')
                      if ar.replace(av, '{version}') != br.replace(bv, '{version}'):
                          return False
                      for field in ['version', 'resolved', 'integrity']:
                          left.pop(field, None)
                          right.pop(field, None)
                      if not json_manifest(left, right):
                          return False
                  return True
              if path.endswith('Cargo.toml'):
                  def deps(a, b):
                      if not isinstance(a, dict) or not isinstance(b, dict) or a.keys() != b.keys():
                          return False
                      for key, value in a.items():
                          other = b[key]
                          if value == other:
                              continue
                          if isinstance(value, str) and isinstance(other, str):
                              if not compatible(value, other):
                                  return False
                          elif isinstance(value, dict) and isinstance(other, dict):
                              x, y = dict(value), dict(other)
                              av, bv = x.pop('version', ''), y.pop('version', '')
                              if x != y or not compatible(av, bv):
                                  return False
                          else:
                              return False
                      return True
                  def manifest(a, b):
                      if a == b:
                          return True
                      if not isinstance(a, dict) or not isinstance(b, dict) or a.keys() != b.keys():
                          return False
                      return all((deps(a[k], b[k]) if k in {'dependencies', 'dev-dependencies', 'build-dependencies'}
                                  else manifest(a[k], b[k])) for k in a)
                  return manifest(tomllib.loads(before), tomllib.loads(after))
              if path.endswith('Cargo.lock'):
                  a, b = tomllib.loads(before), tomllib.loads(after)
                  ap, bp = a.pop('package', []), b.pop('package', [])
                  if a != b or not ap or len(ap) != len(bp):
                      return False
                  # Stable sorting pairs multiple installed versions of the same crate.
                  order = lambda p: (p['name'], p.get('source', ''), tuple(map(int, re.match(r'^(\d+)\.(\d+)\.(\d+)', p['version']).groups())) + (p['version'],))
                  for x, y in zip(sorted(ap, key=order), sorted(bp, key=order)):
                      left, right = dict(x), dict(y)
                      if left == right:
                          continue
                      av, bv = left['version'], right['version']
                      if not compatible(av, bv) or (av == bv and left.get('checksum') != right.get('checksum')):
                          return False
                      for field in ['version', 'checksum']:
                          left.pop(field, None)
                          right.pop(field, None)
                      # Cargo may rewire a reference to another already-installed version.
                      # No source, crate identity, metadata, or dependency names can change.
                      ad, bd = left.pop('dependencies', []), right.pop('dependencies', [])
                      if left != right or [s.split()[0] for s in ad] != [s.split()[0] for s in bd]:
                          return False
                      known = {(p['name'], p['version']) for p in ap + bp}
                      if any(len(s.split()) > 1 and tuple(s.split()[:2]) not in known for s in bd):
                          return False
                  return True
              if path.endswith('go.mod'):
                  old, new = before.splitlines(), after.splitlines()
                  if len(old) != len(new):
                      return False
                  require = re.compile(r'(\s*(?:require\s+)?[A-Za-z0-9._~/-]+\s+)(v\d+\.\d+\.\d+)(\s*(?:// indirect)?\s*)')
                  for a, b in zip(old, new):
                      if a == b:
                          continue
                      left, right = require.fullmatch(a), require.fullmatch(b)
                      if not left or not right or left.group(1, 3) != right.group(1, 3) or not compatible(left[2], right[2]):
                          return False
                  return True
              if path.endswith('go.sum'):
                  def sums(text):
                      result = {}
                      for line in text.splitlines():
                          module, version, checksum = line.split()
                          suffix = '/go.mod' if version.endswith('/go.mod') else ''
                          result.setdefault((module, suffix), []).append((version.removesuffix('/go.mod'), checksum))
                      return {k: sorted(v) for k, v in result.items()}
                  a, b = sums(before), sums(after)
                  return a.keys() == b.keys() and all(len(a[k]) == len(b[k]) and all(
                      x == y or (x[0] != y[0] and compatible(x[0], y[0])) for x, y in zip(a[k], b[k])) for k in a)
              # Unsupported edits keep their normal human review requirement.
              return False


          def verify_contents(get, repo, base, head, files):
              for file in files:
                  path = file['filename']
                  if file['status'] != 'modified':
                      raise ValueError('new dependency files require manual review')
                  def read(ref):
                      blob = get(f"repos/{repo}/contents/{quote(path, safe='/')}?ref={ref}")
                      if blob.get('encoding') != 'base64' or blob.get('size', MAX_ARCHIVE + 1) > MAX_ARCHIVE:
                          raise ValueError('unsupported or oversized GitHub blob')
                      return base64.b64decode(blob['content'], validate=False).decode('utf-8')
                  if not content_compatible(path, read(base), read(head)):
                      raise ValueError(f'file requires manual compatibility review: {path}')


          def candidate(pr, repo, branch, head):
              return (pr.get("state") == "open" and not pr.get("draft")
                      and pr.get("user", {}).get("id") == UPD_BOT_ID
                      and pr.get("user", {}).get("type") == "Bot"
                      and pr.get("base", {}).get("ref") == branch
                      and pr.get("base", {}).get("repo", {}).get("full_name") == repo
                      and pr.get("head", {}).get("ref") == "deps/upd"
                      and pr.get("head", {}).get("repo", {}).get("full_name") == repo
                      and pr.get("head", {}).get("sha") == head
                      and (pr.get("auto_merge") or {}).get("merge_method") == "squash"
                      and (pr.get("auto_merge") or {}).get("enabled_by", {}).get("id") == UPD_BOT_ID)


          def trusted_revision(get, reference):
              match = re.fullmatch(r"rvben/upd/\.github/workflows/dependency-health\.yml@([a-f0-9]{40})", reference.get("path", ""))
              if not match or reference.get("sha") != match[1]:
                  return False
              if match[1] == TRUSTED_UPD_SHA:
                  return True
              # Future stable releases must be published by the same upstream and resolve
              # to this exact commit. Branch refs, prereleases, and older guards are denied.
              for tag in get("repos/rvben/upd/tags?per_page=100"):
                  version = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", tag["name"])
                  if (version and tuple(map(int, version.groups())) >= (0, 18, 2)
                          and tag["commit"]["sha"] == match[1]):
                      release = get("repos/rvben/upd/releases/tags/" + tag["name"])
                      return (release.get("tag_name") == tag["name"] and not release.get("draft", True)
                              and not release.get("prerelease", True) and bool(release.get("published_at")))
              return False


          def dismiss_stale(get, repo, branch):
              prs = get(f"repos/{repo}/pulls?state=open&head={repo.split('/')[0]}:deps/upd&base={branch}&per_page=100")
              for pr in prs:
                  if pr.get('user', {}).get('id') != UPD_BOT_ID:
                      continue
                  for page in range(1, 101):
                      reviews = get(f"repos/{repo}/pulls/{pr['number']}/reviews?per_page=100&page={page}")
                      for item in reviews:
                          if ((item.get('user') or {}).get('login') == 'github-actions[bot]'
                                  and item.get('state') == 'APPROVED'
                                  and item.get('commit_id') != pr['head']['sha']):
                              get(f"repos/{repo}/pulls/{pr['number']}/reviews/{item['id']}/dismissals", {
                                  'message': 'Withdrawing approval of an older rolling proposal.'
                              }, method='PUT')
                      if len(reviews) < 100:
                          break
                  else:
                      raise ValueError('review history exceeds safety bound')


          def verify_merge_scope(get, repo, branch, base, head, number, files):
              rules = get(f"repos/{repo}/rules/branches/{quote(branch, safe='')}")
              if not any(r['type'] == 'pull_request'
                         and r.get('parameters', {}).get('dismiss_stale_reviews_on_push') is True
                         and r.get('parameters', {}).get('required_approving_review_count', 0) >= 1 for r in rules):
                  raise ValueError('automatic approval requires a stale-dismissal review ruleset')
              if not any(r['type'] == 'required_status_checks'
                         and r.get('parameters', {}).get('strict_required_status_checks_policy') is True
                         and r.get('parameters', {}).get('required_status_checks')
                         and all(isinstance(c.get('integration_id'), int) and c['integration_id'] > 0
                                 for c in r['parameters']['required_status_checks']) for r in rules):
                  raise ValueError('automatic approval requires strict required CI checks')
              # A dispatch on a tag named like the default branch must not introduce an
              # unreviewed parent. Bind to the actual branch ref, not its ambiguous name.
              tip = get(f"repos/{repo}/git/ref/heads/{quote(branch, safe='')}")['object']['sha']
              if get(f"repos/{repo}/compare/{base}...{tip}")['status'] not in {'identical', 'ahead'}:
                  raise ValueError('triggering base is not on the protected default branch')
              comparison = get(f"repos/{repo}/compare/{tip}...{head}")
              if comparison.get('merge_base_commit', {}).get('sha') != base:
                  raise ValueError('pull request merge base differs from the validated base')
              actual = get(f"repos/{repo}/pulls/{number}/files?per_page=100")
              identity = lambda rows: sorted((f['filename'], f['status'], f['sha']) for f in rows)
              if len(actual) >= 100 or identity(actual) != identity(files):
                  raise ValueError('pull request diff differs from the validated proposal')


          def review(repo, run_id, get=api, download=archive):
              if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo) or not str(run_id).isdigit():
                  raise ValueError("invalid repository or run")
              if repo not in REVIEW_PATHS:
                  raise ValueError("repository has not opted in to this review policy")
              metadata = get(f"repos/{repo}")
              branch = metadata["default_branch"]
              dismiss_stale(get, repo, branch)
              run = get(f"repos/{repo}/actions/runs/{run_id}")
              if (run["status"] != "completed" or run["conclusion"] != "success"
                      or run["event"] not in {"schedule", "workflow_dispatch"}
                      or run["head_repository"]["full_name"] != repo
                      or run["head_branch"] != branch
                      or run["path"] != ".github/workflows/dependencies.yml"):
                  raise ValueError("run is not a successful trusted default-branch updater")
              base = run["head_sha"]
              if not re.fullmatch(r"[a-f0-9]{40}", base):
                  raise ValueError("invalid run base")
              # GitHub resolves the actual referenced reusable workflow, independent of
              # anything the repository-controlled update/validation commands can write.
              references = run.get("referenced_workflows", [])
              if len(references) != 1 or not trusted_revision(get, references[0]):
                  raise ValueError("run did not use the reviewed compatibility guard")
              jobs = get(f"repos/{repo}/actions/runs/{run_id}/jobs?per_page=100")["jobs"]
              if not jobs or len(jobs) > 2 or any(j["name"] not in {"update / update", "update / publish"} for j in jobs):
                  raise ValueError("unexpected jobs in the trusted updater run")
              publishers = [j for j in jobs if j["name"] == "update / publish"]
              if len(publishers) == 1 and publishers[0]["conclusion"] == "skipped":
                  print("No proposal was published by this run.")
                  return
              if len(publishers) == 1 and publishers[0]["conclusion"] == "success" and any(
                      s["name"] == "Publish rolling pull request" and s["conclusion"] == "skipped"
                      for s in publishers[0]["steps"]):
                  print("No proposal was published by this run.")
                  return
              required_steps = {"Enforce publisher proposal policy", "Publish rolling pull request"}
              if len(publishers) != 1 or publishers[0]["conclusion"] != "success" or not required_steps.issubset(
                      {s["name"] for s in publishers[0]["steps"] if s["conclusion"] == "success"}):
                  raise ValueError("isolated publisher did not validate and publish this proposal")
              artifacts = get(f"repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100")["artifacts"]
              def evidence(name):
                  matches = [a for a in artifacts if a["name"] == name and not a["expired"]
                             and a["workflow_run"]["id"] == int(run_id)]
                  if len(matches) != 1:
                      raise ValueError("missing or ambiguous run evidence")
                  return download(repo, matches[0])
              proposal = proposal_head(evidence("upd-proposal"), base)
              # Independently bind the claimed bundle head to GitHub's stored commit graph
              # and the repository's explicit dependency-file scope.
              commit = get(f"repos/{repo}/commits/{proposal}?per_page=100")
              files = commit.get("files", [])
              if (commit.get("sha") != proposal
                      or [p["sha"] for p in commit.get("parents", [])] != [base]
                      or not files or len(files) >= 100
                      or any(f["status"] not in {"modified", "added"} or not any(
                          PurePosixPath('/' + f["filename"]).match('/' + pattern) for pattern in REVIEW_PATHS[repo]) for f in files)):
                  raise ValueError("GitHub commit is not one scoped proposal on the triggering base")
              report = evidence("upd-report")
              presentation = json.loads(report["upd-presentation.json"])
              if presentation.get("auto_merge_requested") is not True or presentation.get("auto_merge_eligible") is not True:
                  raise ValueError("proposal requires manual review")
              verify_contents(get, repo, base, proposal, files)
              prs = get(f"repos/{repo}/pulls?state=open&head={repo.split('/')[0]}:deps/upd&base={branch}&per_page=100")
              matches = [p for p in prs if candidate(p, repo, branch, proposal)]
              if not matches:
                  print("No current eligible proposal to approve.")
                  return
              if len(matches) != 1:
                  raise ValueError("ambiguous pull request")
              number = matches[0]["number"]
              # Recheck immediately before submission. The approval is attached to the
              # evidence's exact SHA; dismissed stale reviews protect a later replacement.
              current = get(f"repos/{repo}/pulls/{number}")
              if not candidate(current, repo, branch, proposal):
                  raise ValueError("pull request changed before review")
              verify_merge_scope(get, repo, branch, base, proposal, number, files)
              posted = get(f"repos/{repo}/pulls/{number}/reviews", {
                  "commit_id": proposal, "event": "APPROVE",
                  "body": "Validated the exact proposal from the trusted upd run: compatible update, isolated publication policy passed. Required CI and code-owner rules still apply."
              })
              after = get(f"repos/{repo}/pulls/{number}")
              if after.get("merged") and after.get("head", {}).get("sha") == proposal:
                  print(f"The approved proposal in PR #{number} has already merged.")
                  return
              try:
                  if posted.get('commit_id') != proposal or posted.get('state') != 'APPROVED':
                      raise ValueError('GitHub review response does not identify the approved proposal')
                  if not candidate(after, repo, branch, proposal):
                      raise ValueError('proposal changed during review')
                  verify_merge_scope(get, repo, branch, base, proposal, number, files)
              except Exception as problem:
                  get(f"repos/{repo}/pulls/{number}/reviews/{posted['id']}/dismissals", {
                      "message": "Proposal or protections changed during approval; discarding this review."
                  }, method="PUT")
                  raise ValueError("proposal changed during review; approval dismissed") from problem
              print(f"Approved the validated proposal in PR #{number} at {proposal}.")


          if __name__ == "__main__":
              review(os.environ["GH_REPO"], os.environ["UPD_RUN_ID"])
          PY_REVIEW
