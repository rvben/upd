name: Dependency health with upd

on:
  workflow_call:
    inputs:
      runner:
        description: Linux runner label
        type: string
        default: ubuntu-24.04
      upd-version:
        description: Exact released upd version; empty follows the verified release manifest
        type: string
        default: ""
      upd-sha256:
        description: Archive digest; required for a version absent from the release manifest
        type: string
        default: ""
      upd-target:
        description: Release target; detected for supported Linux runners when empty
        type: string
        default: ""
      paths:
        description: Whitespace-separated repository paths passed to upd
        type: string
        default: "."
      langs:
        description: Comma-separated ecosystem filter; defaults to Actions for compatibility
        type: string
        default: actions
      packages:
        description: Comma-separated package filter
        type: string
        default: ""
      min-age:
        description: Minimum eligible release age; empty uses repository configuration
        type: string
        default: 7d
      max-bump:
        description: Highest applied bump; empty uses repository configuration
        type: string
        default: minor
      lock:
        description: Regenerate lockfiles; requires ecosystem tools on the runner
        type: boolean
        default: false
      update-action-shas:
        description: Verify and update immutable GitHub Action SHA pins
        type: boolean
        default: true
      prepare-command:
        description: Command that installs or prepares repository-specific tooling
        type: string
        default: ""
      validation-command:
        description: Command run after updates and before publishing
        type: string
        default: ""
      validate-actions:
        description: Run actionlint when workflow files change
        type: boolean
        default: true
      fail-on-blocked:
        description: Fail when an update is blocked by a safety condition
        type: boolean
        default: false
      branch:
        description: Automation-owned rolling branch
        type: string
        default: automation/upd-github-actions
      commit-message:
        description: Conventional Commits message for the generated commit
        type: string
        default: "ci(deps): update dependencies with upd"
      pull-request-title:
        description: Pull-request title override; empty derives a concise title from the update evidence
        type: string
        default: ""
      auto-merge:
        description: Ask GitHub to merge after all repository checks pass
        type: boolean
        default: false
      merge-method:
        description: Auto-merge method (squash, merge, or rebase)
        type: string
        default: squash
    secrets:
      pull-request-token:
        description: Fine-grained PAT; a single-repository alternative to a GitHub App
        required: false
    outputs:
      changed:
        description: Whether upd produced a repository change
        value: ${{ jobs.update.outputs.changed }}
      pull-request-url:
        description: Created or updated pull-request URL
        value: ${{ jobs.publish.outputs.pull-request-url }}
permissions:
  contents: read
  packages: read
  pull-requests: read

env:
  UPD_HOSTED_BROKER_AUDIENCE: upd-token-broker
  UPD_HOSTED_BROKER_URL: https://upd-token-broker-6e5p6y25aa-ez.a.run.app/v1/token

concurrency:
  group: upd-dependency-writes-${{ github.repository }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      base-sha: ${{ steps.branch.outputs.base-sha }}
      report-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    env:
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate configuration
        env:
          BRANCH: ${{ inputs.branch }}
          MERGE_METHOD: ${{ inputs.merge-method }}
          UPD_TARGET: ${{ inputs.upd-target }}
          UPD_VERSION: ${{ inputs.upd-version }}
        run: |
          set -euo pipefail
          if [[ -n "$UPD_VERSION" && ! "$UPD_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "upd-version must be an exact v-prefixed release" >&2
            exit 4
          fi
          if [[ -n "$UPD_TARGET" && ! "$UPD_TARGET" =~ ^[0-9A-Za-z_.+-]+$ ]]; then
            echo "upd-target contains unsupported characters" >&2
            exit 4
          fi
          if ! git check-ref-format --branch "$BRANCH" >/dev/null 2>&1; then
            echo "Invalid automation branch: $BRANCH" >&2
            exit 4
          fi
          if [[ "$BRANCH" == "$BASE_BRANCH" ]]; then
            echo "The automation branch must differ from the default branch" >&2
            exit 4
          fi
          case "$MERGE_METHOD" in
            squash|merge|rebase) ;;
            *) echo "merge-method must be squash, merge, or rebase" >&2; exit 4 ;;
          esac

      - name: Install verified upd release
        env:
          REQUESTED_SHA256: ${{ inputs.upd-sha256 }}
          REQUESTED_TARGET: ${{ inputs.upd-target }}
          REQUESTED_VERSION: ${{ inputs.upd-version }}
        run: |
          set -euo pipefail
          version="$REQUESTED_VERSION"
          target="$REQUESTED_TARGET"
          if [[ -z "$target" ]]; then
            case "$(uname -m)" in
              x86_64|amd64) target=x86_64-unknown-linux-gnu ;;
              aarch64|arm64) target=aarch64-unknown-linux-gnu ;;
              *) echo "Unsupported runner architecture: $(uname -m); set upd-target" >&2; exit 4 ;;
            esac
          fi

          expected_sha="$REQUESTED_SHA256"
          if [[ -z "$version" || -z "$expected_sha" ]]; then
            manifest="$RUNNER_TEMP/upd-release-pins.json"
            curl --silent --show-error --fail-with-body --location \
              --retry 3 --retry-all-errors \
              --output "$manifest" \
              https://raw.githubusercontent.com/rvben/upd/main/release-pins.json

            schema="$(jq --exit-status --raw-output '.schema' "$manifest")"
            manifest_version="$(jq --exit-status --raw-output '.version' "$manifest")"
            if [[ "$schema" != 1 || ! "$manifest_version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "The canonical upd release manifest is invalid" >&2
              exit 2
            fi
            if [[ -z "$version" ]]; then
              version="$manifest_version"
            fi
            if [[ -z "$expected_sha" ]]; then
              if [[ "$version" != "$manifest_version" ]]; then
                echo "Set upd-sha256 when selecting $version; the release manifest pins $manifest_version" >&2
                exit 4
              fi
              expected_asset="upd-${version}-${target}.tar.gz"
              manifest_asset="$(jq --exit-status --raw-output --arg target "$target" '.assets[$target].name' "$manifest")"
              expected_sha="$(jq --exit-status --raw-output --arg target "$target" '.assets[$target].sha256' "$manifest")"
              if [[ "$manifest_asset" != "$expected_asset" ]]; then
                echo "The release manifest does not contain the expected asset for $target" >&2
                exit 2
              fi
            fi
          fi
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Resolved upd version is invalid" >&2
            exit 2
          fi
          if [[ ! "$expected_sha" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "upd-sha256 must be a 64-character hexadecimal digest" >&2
            exit 4
          fi

          install_dir="$RUNNER_TEMP/upd-bin"
          mkdir -p "$install_dir"
          asset="upd-${version}-${target}.tar.gz"
          curl --silent --show-error --fail-with-body --location \
            --retry 3 --retry-all-errors \
            --output "$install_dir/$asset" \
            "https://github.com/rvben/upd/releases/download/${version}/${asset}"
          actual_sha="$(sha256sum "$install_dir/$asset" | cut -d ' ' -f 1)"
          if [[ "${actual_sha,,}" != "${expected_sha,,}" ]]; then
            echo "Checksum verification failed for $asset" >&2
            exit 2
          fi
          tar --extract --gzip --file "$install_dir/$asset" --directory "$install_dir" upd
          chmod 0755 "$install_dir/upd"
          "$install_dir/upd" --version
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Rebuild rolling branch from the default branch
        id: branch
        env:
          BRANCH: ${{ inputs.branch }}
          READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          askpass="$RUNNER_TEMP/upd-read-askpass"
          # shellcheck disable=SC2016
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'case "$1" in *Username*) printf "%s\\n" x-access-token ;; *) printf "%s\\n" "$READ_TOKEN" ;; esac' \
            > "$askpass"
          chmod 0700 "$askpass"
          trap 'rm -f "$askpass"' EXIT
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git fetch --no-tags origin \
            "+refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}"
          git switch --force-create "$BRANCH" "refs/remotes/origin/${BASE_BRANCH}"
          echo "base-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare repository tooling
        if: inputs.prepare-command != ''
        env:
          PREPARE_COMMAND: ${{ inputs.prepare-command }}
        run: |
          set -euo pipefail
          bash -euo pipefail -c "$PREPARE_COMMAND"
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "The prepare command changed repository files" >&2
            exit 2
          fi

      - name: Apply policy-approved dependency updates
        id: update
        env:
          # Unauthenticated GitHub API calls are throttled to 60 an hour, which
          # upd reports as lookup errors rather than as up-to-date actions.
          GITHUB_TOKEN: ${{ github.token }}
          LOCK: ${{ inputs.lock }}
          MAX_BUMP: ${{ inputs.max-bump }}
          MIN_AGE: ${{ inputs.min-age }}
          PACKAGES: ${{ inputs.packages }}
          PATHS: ${{ inputs.paths }}
          LANGS: ${{ inputs.langs }}
          UPDATE_ACTION_SHAS: ${{ inputs.update-action-shas }}
          REPORT: ${{ runner.temp }}/upd-report.json
        run: |
          set -euo pipefail
          args=(update --apply --format json)
          [[ "$LOCK" == true ]] && args+=(--lock)
          [[ "$UPDATE_ACTION_SHAS" == true ]] && args+=(--update-action-shas)
          [[ -n "$MIN_AGE" ]] && args+=(--min-age "$MIN_AGE")
          [[ -n "$MAX_BUMP" ]] && args+=(--max-bump "$MAX_BUMP")
          [[ -n "$LANGS" ]] && args+=(--lang "$LANGS")
          [[ -n "$PACKAGES" ]] && args+=(--package "$PACKAGES")
          read -r -a update_paths <<< "${PATHS:-.}"

          upd "${args[@]}" "${update_paths[@]}" > "$REPORT"
          jq --exit-status . "$REPORT" >/dev/null
          if ! jq --exit-status '(.summary.errors // 0) == 0' "$REPORT" >/dev/null; then
            echo "upd reported errors; refusing to publish a partial result" >&2
            exit 2
          fi

          git add --all
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate changed workflow syntax
        if: steps.update.outputs.changed == 'true' && inputs.validate-actions
        run: |
          set -euo pipefail
          if git diff --cached --name-only --diff-filter=ACMR -- \
            '.github/workflows/*.yml' '.github/workflows/*.yaml' | grep --quiet .; then
            go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes=
          fi

      - name: Run repository validation
        if: steps.update.outputs.changed == 'true' && inputs.validation-command != ''
        env:
          VALIDATION_COMMAND: ${{ inputs.validation-command }}
        run: bash -euo pipefail -c "$VALIDATION_COMMAND"

      - name: Verify validation did not mutate the proposal
        if: steps.update.outputs.changed == 'true'
        run: |
          set -euo pipefail
          if ! git diff --quiet || [[ -n "$(git ls-files --others --exclude-standard)" ]]; then
            echo "Validation changed uncommitted files; refusing to publish an unvalidated diff" >&2
            exit 2
          fi

      - name: Build provider-neutral review presentation
        env:
          AUTO_MERGE: ${{ inputs.auto-merge }}
          CHANGED: ${{ steps.update.outputs.changed }}
          LOCK: ${{ inputs.lock }}
          MAX_BUMP: ${{ inputs.max-bump }}
          MIN_AGE: ${{ inputs.min-age }}
          PRESENTATION: ${{ runner.temp }}/upd-presentation.json
          REPORT: ${{ runner.temp }}/upd-report.json
          VALIDATION_CONFIGURED: ${{ inputs.validation-command != '' }}
        run: |
          set -euo pipefail
          mapfile -t changed_paths < <(git diff --cached --name-only)
          changed_paths_json="$(printf '%s\n' "${changed_paths[@]}" | jq --raw-input --slurp 'split("\n") | map(select(length > 0))')"
          jq \
            --arg min_age "$MIN_AGE" \
            --arg max_bump "$MAX_BUMP" \
            --argjson auto_merge "$AUTO_MERGE" \
            --argjson changed "$CHANGED" \
            --argjson changed_paths "$changed_paths_json" \
            --argjson lock "$LOCK" \
            --argjson validation_configured "$VALIDATION_CONFIGURED" '
            def clean($limit):
              if . == null then "" else tostring end
              | gsub("[\\x00-\\x1f\\x7f\u202a-\u202e\u2066-\u2069]"; " ")
              | gsub("[[:space:]]+"; " ")
              | sub("^ "; "") | sub(" $"; "")
              | .[0:$limit];
            def update_rows:
              [.files[]? as $file
               | $file.updates[]?
               | select(.status == null or .status == "applied" or .status == "pending_relock")
               | {
                   package: (.package // "unknown dependency" | clean(160)),
                   current: (.current // "unknown" | clean(160)),
                   latest: (.latest // "unknown" | clean(160)),
                   bump: (.bump // "unknown" | clean(32)),
                   path: ($file.path // "unknown file" | clean(160)),
                   status: (.status // "applied" | clean(32))
                 }]
              | unique_by([.package, .current, .latest, .path, .status])
              | sort_by([.package, .path, .current, .latest]);
            def annotation_rows:
              [.files[]? as $file | $file.annotations[]? | {
                package: (.package // "unknown dependency" | clean(160)),
                version: (.version // "unknown" | clean(160)),
                path: ($file.path // "unknown file" | clean(160))
              }] | unique_by([.package, .version, .path]) | sort_by([.package, .path]);
            def normalized_rows:
              [.files[]? as $file | $file.normalized[]? | {
                package: (.package // "unknown dependency" | clean(160)),
                previous: (if .previous_spec == null then "(no specifier)" else (.previous_spec | clean(160)) end),
                new: (.new_spec // "unknown" | clean(160)),
                version: (.version // "unknown" | clean(160)),
                path: ($file.path // "unknown file" | clean(160)),
                line: .line
              }] | sort_by([.package, .path, .line]);
            def policy_rows:
              ([.files[]? as $file |
                (($file.held_back // [])[] | {
                  kind: "cooldown", package: (.package // "unknown dependency" | clean(160)),
                  selected: (.chosen // .current // "unknown" | clean(160)),
                  available: (.skipped_latest // "unknown" | clean(160)),
                  path: ($file.path // "unknown file" | clean(160))
                }),
                (($file.skipped_by_cooldown // [])[] | {
                  kind: "cooldown", package: (.package // "unknown dependency" | clean(160)),
                  selected: (.current // "unknown" | clean(160)),
                  available: (.skipped_latest // "unknown" | clean(160)),
                  path: ($file.path // "unknown file" | clean(160))
                }),
                (($file.capped // [])[] | {
                  kind: "bump ceiling", package: (.package // "unknown dependency" | clean(160)),
                  selected: (.current // "unknown" | clean(160)),
                  available: (.available // "unknown" | clean(160)),
                  path: ($file.path // "unknown file" | clean(160))
                })]
              | unique_by([.kind, .package, .selected, .available, .path]))
              + [.files[]? as $file |
                 ($file.normalized // [])[] | select(.skipped_latest != null) | {
                   kind: "cooldown", package: (.package // "unknown dependency" | clean(160)),
                   selected: (.version // "unknown" | clean(160)),
                   available: (.skipped_latest | clean(160)),
                   path: ($file.path // "unknown file" | clean(160))
                 }]
              | sort_by([.kind, .package, .path]);
            def blocked_rows:
              ([.files[]? as $file | ($file.skipped // [])[]
                | select(.status == "blocked")
                | {
                    package: (.package // "unknown dependency" | clean(160)),
                    current: (.current // "unknown" | clean(160)),
                    reason: (.message // .reason // "blocked by a safety condition" | clean(240)),
                    path: ($file.path // "unknown file" | clean(160))
                  }]
               +
               [.files[]? as $file | $file.updates[]?
                | select(.status == "unfixable" or .status == "skipped")
                | {
                    package: (.package // "unknown dependency" | clean(160)),
                    current: (.current // "unknown" | clean(160)),
                    reason: (.error // "upd could not apply this update safely" | clean(240)),
                    path: ($file.path // "unknown file" | clean(160))
                  }])
              | unique_by([.package, .current, .reason, .path])
              | sort_by([.package, .path, .reason]);
            . as $report
            | (update_rows) as $updates
            | (annotation_rows) as $annotations
            | (normalized_rows) as $normalized
            | (policy_rows) as $policy_holds
            | (blocked_rows) as $blocked
            | {
                schema: 1,
                state: (if $changed then "ready" elif ($blocked | length) > 0 then "blocked_no_change" else "clean" end),
                changed: $changed,
                updates: $updates,
                annotations: $annotations,
                normalized: $normalized,
                policy_holds: $policy_holds,
                blocked: $blocked,
                changed_paths: ($changed_paths | map(clean(160)) | unique | sort),
                counts: {
                  updates: ($updates | length),
                  updates_major: ([$updates[] | select((.bump | ascii_downcase) == "major")] | length),
                  updates_minor: ([$updates[] | select((.bump | ascii_downcase) == "minor")] | length),
                  updates_patch: ([$updates[] | select((.bump | ascii_downcase) == "patch")] | length),
                  updates_review_worthy: ([$updates[] | select((.bump | ascii_downcase) != "patch")] | length),
                  updates_quiet: ([$updates[] | select((.bump | ascii_downcase) == "patch")] | length),
                  annotations: ($annotations | length),
                  normalized: ($normalized | length),
                  files_changed: ($changed_paths | length),
                  policy_holds: ($policy_holds | length),
                  blocked: ($blocked | length),
                  warnings: ($report.summary.warnings // 0),
                  not_examined: ($report.summary.not_examined // 0)
                },
                policy: {
                  min_age: (if $min_age == "" then "repository configuration" else ($min_age | clean(80)) end),
                  max_bump: (if $max_bump == "" then "repository configuration" else ($max_bump | clean(32)) end),
                  lockfile_regeneration: $lock
                },
                validation: {repository_command_configured: $validation_configured, proposal_integrity_passed: true},
                auto_merge_requested: $auto_merge
              }
            | (.changed_paths as $paths
               | (($paths | length) > 0 and all($paths[]; startswith(".github/workflows/")))) as $workflow_only
            | (if $workflow_only then "ci(deps)" else "chore(deps)" end) as $title_prefix
            | .title = (
                if .counts.updates == 1 and .counts.normalized == 0 then
                  if ((.updates[0].package | test("^[A-Za-z0-9@][A-Za-z0-9._@/+-]{0,79}$")) and
                      (.updates[0].latest | test("^[A-Za-z0-9][A-Za-z0-9._:+-]{0,79}$"))) then
                    "\($title_prefix): refresh \(.updates[0].package) to \(.updates[0].latest)"
                  else
                    "\($title_prefix): refresh dependency"
                  end
                elif .counts.updates > 0 and .counts.normalized > 0 then
                  "\($title_prefix): prepare \(.counts.updates + .counts.normalized) dependency changes"
                elif .counts.updates > 1 then
                  "\($title_prefix): refresh \(.counts.updates) dependencies"
                elif .counts.normalized == 1 then
                  if (.normalized[0].package | test("^[A-Za-z0-9@][A-Za-z0-9._@/+-]{0,79}$")) then
                    "\($title_prefix): normalize \(.normalized[0].package) specifier"
                  else
                    "\($title_prefix): normalize dependency specifier"
                  end
                elif .counts.normalized > 1 then
                  "\($title_prefix): normalize \(.counts.normalized) dependency specifiers"
                elif .counts.annotations == 1 then
                  "\($title_prefix): annotate dependency metadata"
                elif .counts.annotations > 1 then
                  "\($title_prefix): annotate \(.counts.annotations) dependency declarations"
                else
                  "\($title_prefix): refresh dependency metadata"
                end
                | clean(72)
              )
          ' "$REPORT" > "$PRESENTATION"

      - name: Package validated proposal
        if: steps.update.outputs.changed == 'true'
        env:
          BASE_SHA: ${{ steps.branch.outputs.base-sha }}
          COMMIT_MESSAGE: ${{ inputs.commit-message }}
        run: |
          set -euo pipefail
          git config user.name "upd automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --message "$COMMIT_MESSAGE"
          read -r proposal_sha parent_sha extra_parent < <(git rev-list --parents -n 1 HEAD)
          if [[ "$proposal_sha" != "$(git rev-parse HEAD)" || "$parent_sha" != "$BASE_SHA" || -n "${extra_parent:-}" ]]; then
            echo "The validated proposal is not a single commit on the prepared base" >&2
            exit 2
          fi
          bundle="$RUNNER_TEMP/upd-proposal.bundle"
          git bundle create "$bundle" HEAD "^$BASE_SHA"
          (
            cd "$RUNNER_TEMP"
            sha256sum upd-proposal.bundle > upd-proposal.bundle.sha256
          )

      - name: Retain machine-readable report
        id: report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upd-report
          path: |
            ${{ runner.temp }}/upd-report.json
            ${{ runner.temp }}/upd-presentation.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish dependency summary
        env:
          ARTIFACT_URL: ${{ steps.report.outputs.artifact-url }}
          FAIL_ON_BLOCKED: ${{ inputs.fail-on-blocked }}
          PRESENTATION: ${{ runner.temp }}/upd-presentation.json
          REPORT: ${{ runner.temp }}/upd-report.json
        run: |
          set -euo pipefail
          jq --raw-output --arg artifact_url "$ARTIFACT_URL" '
            def html:
              tostring | @html
              | gsub("`"; "&#96;") | gsub("\\*"; "&#42;") | gsub("_"; "&#95;")
              | gsub("\\["; "&#91;") | gsub("\\]"; "&#93;") | gsub("\\|"; "&#124;")
              | gsub("\\\\"; "&#92;");
            def code: "<code>\(. | html)</code>";
            def plural($count; $one; $many): if $count == 1 then $one else $many end;
            def overview:
              if .state == "ready" then
                "**Ready for review.** \(.counts.updates + .counts.normalized) dependency \(plural(.counts.updates + .counts.normalized; "change"; "changes")) across " +
                "\(.counts.files_changed) changed \(plural(.counts.files_changed; "file"; "files")); " +
                "\(.counts.policy_holds) held by policy and \(.counts.blocked) blocked."
              elif .state == "blocked_no_change" then
                "**Needs attention.** No proposal was created; \(.counts.blocked) " +
                "\(plural(.counts.blocked; "dependency was"; "dependencies were")) blocked."
              else
                "**No update proposal was needed.** Repository dependencies are within the configured policy."
              end;
            def update_section:
              if (.updates | length) == 0 then ""
              else
                "\n\n### Applied updates (\(.updates | length))\n\n" +
                "| Dependency | Change | Kind | Source |\n" +
                "| --- | --- | --- | --- |\n" +
                (.updates | map(
                  "| \(.package | code) | \((.current + " → " + .latest) | code) | " +
                  "\(.bump | html) | \(.path | code) |"
                ) | join("\n"))
              end;
            def annotation_section:
              if (.annotations | length) == 0 then ""
              else
                "\n\n### Metadata annotations (\(.annotations | length))\n\n" +
                "| Dependency | Version | Source |\n" +
                "| --- | --- | --- |\n" +
                (.annotations | map(
                  "| \(.package | code) | \(.version | code) | \(.path | code) |"
                ) | join("\n"))
              end;
            def normalized_section:
              if (.normalized | length) == 0 then ""
              else
                "\n\n### Normalized specifiers (\(.normalized | length))\n\n" +
                "| Dependency | Before | After | Version | Source |\n" +
                "| --- | --- | --- | --- | --- |\n" +
                (.normalized | map(
                  "| \(.package | code) | \(.previous | code) | \(.new | code) | " +
                  "\(.version | code) | \(.path | code) |"
                ) | join("\n"))
              end;
            def hold_section:
              if (.policy_holds | length) == 0 then ""
              else
                "\n\n### Held by repository policy (\(.policy_holds | length))\n\n" +
                "| Dependency | Selected | Available | Policy | Source |\n" +
                "| --- | --- | --- | --- | --- |\n" +
                (.policy_holds | map(
                  "| \(.package | code) | \(.selected | code) | \(.available | code) | " +
                  "\(.kind | html) | \(.path | code) |"
                ) | join("\n"))
              end;
            def blocked_section:
              if (.blocked | length) == 0 then ""
              else
                "\n\n### Could not update safely (\(.blocked | length))\n\n" +
                "| Dependency | Current | Reason | Source |\n" +
                "| --- | --- | --- | --- |\n" +
                (.blocked | map(
                  "| \(.package | code) | \(.current | code) | \(.reason | html) | \(.path | code) |"
                ) | join("\n"))
              end;
            def changed_files_section:
              if (.changed_paths | length) == 0 then ""
              else
                "\n\n### Changed files (\(.changed_paths | length))\n\n" +
                (.changed_paths | map("- \(. | code)") | join("\n"))
              end;
            def validation_section:
              "\n\n### Validation\n\n" +
              (if .validation.repository_command_configured then
                 "- **Repository validation passed.** The configured command completed successfully."
               else
                 "- **Repository validation was not configured.**"
               end) +
              "\n- **Proposal integrity passed.** Validation did not mutate the prepared change.";
            def policy_section:
              "\n\n### Applied policy\n\n" +
              "- Minimum release age: \(.policy.min_age | code)\n" +
              "- Maximum version bump: \(.policy.max_bump | code)\n" +
              "- Lockfile regeneration: \(if .policy.lockfile_regeneration then "enabled" else "disabled" end)";
            "## upd dependency report\n\n" + overview +
            update_section + normalized_section + annotation_section + hold_section + blocked_section +
            changed_files_section + validation_section + policy_section +
            "\n\n### Machine-readable evidence\n\n" +
            "[Download machine-readable JSON archive](\($artifact_url)) · retained for 7 days"
          ' "$PRESENTATION" >> "$GITHUB_STEP_SUMMARY"

          blocked="$(jq --raw-output '.summary.skipped // 0' "$REPORT")"
          if [[ "$FAIL_ON_BLOCKED" == true && "$blocked" -gt 0 ]]; then
            echo "Blocked updates require attention" >&2
            exit 1
          fi

      - name: Transfer validated proposal to isolated publisher
        if: steps.update.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upd-proposal
          path: |
            ${{ runner.temp }}/upd-proposal.bundle
            ${{ runner.temp }}/upd-proposal.bundle.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: update
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    outputs:
      pull-request-url: ${{ steps.publish.outputs.url }}
    env:
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      # This job never executes checked-out repository code. The validated
      # commit crosses a job boundary as a checksummed Git bundle before any
      # write credential is minted.
      - name: Check out prepared base for isolated publication
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.update.outputs.base-sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download review evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: upd-report
          path: ${{ runner.temp }}

      - name: Download validated proposal
        if: needs.update.outputs.changed == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: upd-proposal
          path: ${{ runner.temp }}

      - name: Restore validated proposal
        if: needs.update.outputs.changed == 'true'
        env:
          BASE_SHA: ${{ needs.update.outputs.base-sha }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          (
            cd "$RUNNER_TEMP"
            sha256sum --check upd-proposal.bundle.sha256
          )
          bundle="$RUNNER_TEMP/upd-proposal.bundle"
          git bundle verify "$bundle"
          git fetch "$bundle" HEAD
          proposal_sha="$(git rev-parse FETCH_HEAD)"
          read -r verified_sha parent_sha extra_parent < <(git rev-list --parents -n 1 "$proposal_sha")
          if [[ "$verified_sha" != "$proposal_sha" || "$parent_sha" != "$BASE_SHA" || -n "${extra_parent:-}" ]]; then
            echo "The transferred proposal is not a single commit on the prepared base" >&2
            exit 2
          fi
          git switch --force-create "$BRANCH" "$proposal_sha"

      - name: Inspect publication state
        id: publication-state
        env:
          BRANCH: ${{ inputs.branch }}
          GH_TOKEN: ${{ github.token }}
          READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr_count="$(gh pr list --head "$BRANCH" --base "$BASE_BRANCH" --state open \
            --limit 100 --json number | jq 'length')"
          if [[ "$pr_count" -gt 1 ]]; then
            echo "More than one open upd pull request uses $BRANCH; refusing to choose one" >&2
            exit 2
          fi
          askpass="$RUNNER_TEMP/upd-read-askpass"
          # shellcheck disable=SC2016
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'case "$1" in *Username*) printf "%s\\n" x-access-token ;; *) printf "%s\\n" "$READ_TOKEN" ;; esac' \
            > "$askpass"
          chmod 0700 "$askpass"
          trap 'rm -f "$askpass"' EXIT
          remote_sha="$(GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            git ls-remote --heads origin "refs/heads/$BRANCH" | cut -f 1)"
          cleanup_required=false
          if [[ "$pr_count" -eq 1 || -n "$remote_sha" ]]; then
            cleanup_required=true
          fi
          echo "cleanup-required=$cleanup_required" >> "$GITHUB_OUTPUT"
          echo "expected-remote-sha=$remote_sha" >> "$GITHUB_OUTPUT"

      # Publication is isolated from every repository-controlled command. A
      # write token is minted only when a proposal or stale state needs a write,
      # and workflow scope is requested only for a workflow-file proposal.
      - name: Select a check-triggering publishing credential
        id: credential-needs
        if: needs.update.outputs.changed == 'true' || steps.publication-state.outputs.cleanup-required == 'true'
        env:
          BASE_SHA: ${{ needs.update.outputs.base-sha }}
          CHANGED: ${{ needs.update.outputs.changed }}
          HAS_PAT: ${{ secrets.pull-request-token != '' }}
        run: |
          set -euo pipefail
          workflow_files_changed=false
          if [[ "$CHANGED" == true ]] &&
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- \
              '.github/workflows/*.yml' '.github/workflows/*.yaml' | grep --quiet .; then
            workflow_files_changed=true
          fi
          echo "publication-required=true" >> "$GITHUB_OUTPUT"
          echo "workflow-files-changed=$workflow_files_changed" >> "$GITHUB_OUTPUT"
          if [[ "$HAS_PAT" == true ]]; then
            echo "use-broker=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "use-broker=true" >> "$GITHUB_OUTPUT"

      - name: Request publication token
        id: broker-token
        if: steps.credential-needs.outputs.publication-required == 'true' && steps.credential-needs.outputs.use-broker == 'true'
        env:
          BROKER_AUDIENCE: ${{ env.UPD_HOSTED_BROKER_AUDIENCE }}
          BROKER_URL: ${{ env.UPD_HOSTED_BROKER_URL }}
          WORKFLOW_FILES_CHANGED: ${{ steps.credential-needs.outputs.workflow-files-changed }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          if [[ "$BROKER_URL" != https://* || -z "$BROKER_AUDIENCE" ]]; then
            echo "The hosted broker URL must be HTTPS and its audience must not be empty" >&2
            exit 4
          fi
          umask 077
          oidc_response="$RUNNER_TEMP/upd-oidc-response.json"
          broker_request="$RUNNER_TEMP/upd-broker-request.json"
          broker_response="$RUNNER_TEMP/upd-broker-response.json"
          trap 'rm -f "$oidc_response" "$broker_request" "$broker_response"' EXIT
          curl --silent --show-error --fail --get \
            --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --data-urlencode "audience=$BROKER_AUDIENCE" \
            --output "$oidc_response" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL"
          oidc_token="$(jq --exit-status --raw-output '.value | strings | select(length > 0)' "$oidc_response")"
          echo "::add-mask::$oidc_token"
          permissions="$(jq --compact-output --null-input \
            --arg changed "$WORKFLOW_FILES_CHANGED" \
            '{contents: "write", pull_requests: "write"} +
             (if $changed == "true" then {workflows: "write"} else {} end)')"
          jq --null-input \
            --arg oidc_token "$oidc_token" \
            --argjson permissions "$permissions" \
            '{oidc_token: $oidc_token, permissions: $permissions}' > "$broker_request"
          status="$(curl --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --data-binary "@$broker_request" \
            --output "$broker_response" \
            --write-out '%{http_code}' \
            "$BROKER_URL")"
          if [[ "$status" != 200 ]]; then
            echo "The upd token broker rejected the request (HTTP $status)" >&2
            exit 4
          fi
          token="$(jq --exit-status --raw-output '.token | strings | select(length > 0)' "$broker_response")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Publish rolling pull request
        id: publish
        env:
          AUTO_MERGE: ${{ inputs.auto-merge }}
          BRANCH: ${{ inputs.branch }}
          CHANGED: ${{ needs.update.outputs.changed }}
          GH_TOKEN: ${{ steps.broker-token.outputs.token || (steps.credential-needs.outputs.publication-required == 'true' && secrets.pull-request-token) || github.token }}
          HAS_PUBLISHING_TOKEN: ${{ steps.broker-token.outputs.token != '' || (steps.credential-needs.outputs.publication-required == 'true' && secrets.pull-request-token != '') }}
          EXPECTED_REMOTE_SHA: ${{ steps.publication-state.outputs.expected-remote-sha }}
          MERGE_METHOD: ${{ inputs.merge-method }}
          PRESENTATION: ${{ runner.temp }}/upd-presentation.json
          PR_TITLE: ${{ inputs.pull-request-title }}
          REPORT_URL: ${{ needs.update.outputs.report-url }}
        run: |
          set -euo pipefail
          pr_title="$PR_TITLE"
          if [[ -z "$pr_title" ]]; then
            pr_title="$(jq --raw-output '.title' "$PRESENTATION")"
          fi

          find_open_prs() {
            gh pr list --head "$BRANCH" --base "$BASE_BRANCH" --state open \
              --limit 100 --json number,url
          }
          require_unambiguous_pr() {
            local count
            count="$(jq 'length' <<< "$1")"
            if [[ "$count" -gt 1 ]]; then
              echo "More than one open upd pull request uses $BRANCH; refusing to choose one" >&2
              exit 2
            fi
          }
          git_push() {
            local askpass
            askpass="$RUNNER_TEMP/upd-write-askpass"
            # shellcheck disable=SC2016
            printf '%s\n' \
              '#!/usr/bin/env bash' \
              'case "$1" in *Username*) printf "%s\\n" x-access-token ;; *) printf "%s\\n" "$GH_TOKEN" ;; esac' \
              > "$askpass"
            chmod 0700 "$askpass"
            GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git push "$@"
            rm -f "$askpass"
          }

          pr_list="$(find_open_prs)"
          require_unambiguous_pr "$pr_list"

          if [[ "$CHANGED" != true ]]; then
            if [[ "$HAS_PUBLISHING_TOKEN" != true &&
                  ("$(jq 'length' <<< "$pr_list")" -eq 1 || -n "$EXPECTED_REMOTE_SHA") ]]; then
              echo "Cleaning up an obsolete upd pull request requires the configured App or PAT" >&2
              exit 4
            fi
            if [[ "$(jq 'length' <<< "$pr_list")" -eq 1 ]]; then
              pr_number="$(jq --raw-output '.[0].number' <<< "$pr_list")"
              pr_url="$(jq --raw-output '.[0].url' <<< "$pr_list")"
              gh pr close "$pr_number" --comment "Closing because no eligible dependency updates remain."
              echo "Closed obsolete pull request: $pr_url" >> "$GITHUB_STEP_SUMMARY"
            fi
            if [[ -n "$EXPECTED_REMOTE_SHA" ]]; then
              git_push \
                --force-with-lease="refs/heads/${BRANCH}:${EXPECTED_REMOTE_SHA}" \
                origin ":refs/heads/${BRANCH}"
              echo "Removed obsolete automation branch: $BRANCH" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "url=" >> "$GITHUB_OUTPUT"
            echo "No dependency updates within policy." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          commit_sha="$(git rev-parse HEAD)"
          git_push \
            --force-with-lease="refs/heads/${BRANCH}:${EXPECTED_REMOTE_SHA}" \
            origin "HEAD:refs/heads/${BRANCH}"

          body_file="$RUNNER_TEMP/upd-pr-description.md"
          report_url="$REPORT_URL"
          jq --raw-output \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg base_branch "$BASE_BRANCH" \
            --arg report_url "$report_url" '
            def md:
              tostring | @html
              | gsub("`"; "&#96;") | gsub("\\*"; "&#42;") | gsub("_"; "&#95;")
              | gsub("\\["; "&#91;") | gsub("\\]"; "&#93;") | gsub("\\|"; "&#124;")
              | gsub("\\\\"; "&#92;");
            def code: "<code>\(. | md)</code>";
            def plural($count; $one; $many): if $count == 1 then $one else $many end;
            def bump_count($count; $one; $many):
              if $count == 0 then "no \($many)"
              else "\($count) \(if $count == 1 then $one else $many end)"
              end;
            def heading:
              if .counts.updates > 0 and .counts.normalized == 0 then
                "## \(.counts.updates) dependency \(plural(.counts.updates; "update is"; "updates are")) ready for review"
              elif .counts.updates + .counts.normalized > 0 then
                "## \(.counts.updates + .counts.normalized) dependency \(plural(.counts.updates + .counts.normalized; "change is"; "changes are")) ready for review"
              else
                "## \(.counts.annotations) dependency metadata \(plural(.counts.annotations; "annotation is"; "annotations are")) ready for review"
              end;
            def summary:
              if .counts.updates > 0 then
                "**\(bump_count(.counts.updates_minor; "minor"; "minor")) · \(bump_count(.counts.updates_patch; "patch"; "patches")) · \(bump_count(.counts.updates_major; "major"; "majors"))" +
                (if .counts.normalized > 0 then " · \(.counts.normalized) normalized" else "" end) + "**"
              elif .counts.normalized > 0 then
                "**\(.counts.normalized) normalized \(plural(.counts.normalized; "specifier"; "specifiers"))**"
              else
                "**\(.counts.annotations) dependency metadata \(plural(.counts.annotations; "annotation"; "annotations"))**"
              end;
            def policy_note:
              (if .counts.policy_holds > 0 then
                 "\n\(.counts.policy_holds) additional \(plural(.counts.policy_holds; "update remains"; "updates remain")) held by repository policy."
               else "" end) +
              (if .counts.blocked > 0 then
                 "\n**Needs attention:** \(.counts.blocked) \(plural(.counts.blocked; "dependency could"; "dependencies could")) not be changed safely."
               else "" end);
            def attention:
              ([.updates[] | select((.bump | ascii_downcase) != "patch")]) as $review
              | (if ($review | length) > 0 then $review else .updates end) as $items
              | if ($items | length) == 0 then
                  if .counts.normalized > 0 then
                    "\n\n### Specifiers normalized\n\n" +
                    (.normalized[:3] | map("- \((.package + " " + .previous + " → " + .new) | code)") | join("\n")) +
                    (if .counts.normalized > 3 then "\n- _and \(.counts.normalized - 3) more normalized specifiers_" else "" end)
                  elif .counts.annotations > 0 then
                    "\n\n### Metadata refreshed\n\n" +
                    (.annotations[:3] | map("- \((.package + " " + .version) | code)") | join("\n")) +
                    (if .counts.annotations > 3 then "\n- _and \(.counts.annotations - 3) more metadata annotations_" else "" end)
                  else "" end
                else
                  "\n\n### \(if ($review | length) > 0 then "Worth your attention" else "What changed" end)\n\n" +
                  ($items[:3] | map("- \((.package + " " + .current + " → " + .latest) | code)") | join("\n")) +
                  (if ($items | length) > 3 then
                     "\n- _and \(($items | length) - 3) more \(if ($review | length) > 0 then "review-worthy " else "" end)updates_"
                   else "" end)
                end +
                (if .counts.normalized > 0 and ($items | length) > 0 then
                   "\n\n### Normalized specifiers\n\n" +
                   (.normalized[:3] | map("- \((.package + " " + .previous + " → " + .new) | code)") | join("\n")) +
                   (if .counts.normalized > 3 then "\n- _and \(.counts.normalized - 3) more normalized specifiers_" else "" end)
                 else "" end);
            def validation:
              if .validation.repository_command_configured then
                "**Validation passed.** Repository checks and proposal-integrity verification completed successfully."
              else
                "**Proposal integrity passed.** No repository-specific validation command was configured."
              end;
            def merge_intent:
              if .auto_merge_requested then
                "Auto-merge is requested; repository rules still control readiness."
              else "Auto-merge is off."
              end;
            "<p><a href=\"https://github.com/rvben/upd\"><img src=\"https://raw.githubusercontent.com/rvben/upd/84109eaf36c739dc11af0452c6218abb7e47a8e3/assets/logo-wide.svg\" alt=\"upd\" width=\"96\"></a></p>" +
            "\n\n" + heading +
            "\n\n`\($repository)` · Prepared from the latest `\($base_branch)` · \(merge_intent)" +
            "\n\n" + summary + policy_note + attention +
            "\n\n" + validation +
            "\n\n[View the full update report →](\($report_url))"
          ' "$PRESENTATION" > "$body_file"

          if [[ "$(jq 'length' <<< "$pr_list")" -eq 0 ]]; then
            gh pr create --base "$BASE_BRANCH" --head "$BRANCH" \
              --title "$pr_title" --body-file "$body_file" >/dev/null
            pr_list="$(find_open_prs)"
            require_unambiguous_pr "$pr_list"
            if [[ "$(jq 'length' <<< "$pr_list")" -ne 1 ]]; then
              echo "GitHub did not return the newly created pull request" >&2
              exit 2
            fi
          else
            pr_number="$(jq --raw-output '.[0].number' <<< "$pr_list")"
            gh pr edit "$pr_number" --title "$pr_title" --body-file "$body_file" >/dev/null
          fi

          pr_number="$(jq --raw-output '.[0].number' <<< "$pr_list")"
          pr_url="$(jq --raw-output '.[0].url' <<< "$pr_list")"
          if [[ "$pr_number" == null || "$pr_url" == null ]]; then
            echo "GitHub returned an invalid pull-request response" >&2
            exit 2
          fi
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "Pull request: $pr_url" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$AUTO_MERGE" == true ]]; then
            gh pr merge "$pr_number" --auto "--${MERGE_METHOD}" \
              --match-head-commit "$commit_sha"
            echo "GitHub auto-merge enabled for $pr_url" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$(gh pr view "$pr_number" --json autoMergeRequest \
            --jq '.autoMergeRequest != null')" == true ]]; then
            gh pr merge "$pr_number" --disable-auto
            echo "GitHub auto-merge disabled for $pr_url" >> "$GITHUB_STEP_SUMMARY"
          fi
