name: Dependency health
on:
  schedule:
    - cron: "55 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: read
  pull-requests: read

jobs:
  update:
    uses: rvben/upd/.github/workflows/dependency-health.yml@21be6e147726facdb2f1175eb0d95ee8ee2f6020 # v0.17.0
    with:
      langs: rust,actions
      lock: true
      min-age: 7d
      max-bump: minor
      prepare-command: make test-tools
      validation-command: make check
      fail-on-blocked: false
      branch: deps/upd
      commit-message: "chore(deps): refresh dependencies"
