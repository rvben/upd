name: Rust dependency health
on:
  schedule:
    - cron: "55 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  update:
    uses: ./.github/workflows/dependency-health.yml
    with:
      langs: rust
      lock: true
      min-age: 7d
      max-bump: minor
      validation-command: make check
      fail-on-blocked: false
      branch: deps/upd
      commit-message: "chore(deps): update Rust dependencies with upd"
      app-client-id: ${{ vars.UPD_APP_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.UPD_APP_PRIVATE_KEY }}
