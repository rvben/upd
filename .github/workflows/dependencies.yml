name: Dependency health
on:
  schedule:
    - cron: "55 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: read
  pull-requests: read

jobs:
  update:
    uses: rvben/upd/.github/workflows/dependency-health.yml@ac374e74eb4f6b5cbd39965c65292ae5e2b51411 # v0.9.2
    with:
      langs: rust,actions
      lock: true
      min-age: 7d
      max-bump: minor
      validation-command: make check
      fail-on-blocked: false
      branch: deps/upd
      commit-message: "chore(deps): refresh dependencies"
