name: Rust dependency health
on:
  schedule:
    - cron: "55 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: read
  pull-requests: read

jobs:
  update:
    uses: rvben/upd/.github/workflows/dependency-health.yml@1a8c9cd6e0e5f21251f89b2bd9f9fcbff776030d
    with:
      langs: rust
      lock: true
      min-age: 7d
      max-bump: minor
      validation-command: make check
      fail-on-blocked: false
      branch: deps/upd
      commit-message: "chore(deps): update Rust dependencies with upd"
