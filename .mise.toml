# mise configuration for upd development environment
min_version = "2026.4.19"

[env]
RUST_BACKTRACE = "1"
BINSTALL_DISABLE_TELEMETRY = "true"

[tools]
# Rust toolchain - version matches rust-toolchain.toml
rust = "1.96.0"

# Python for maturin/python bindings
python = "3.14.7"

# UV - Fast Python package manager
uv = "0.12.5"

# GitHub Actions workflow validation
actionlint = "1.7.12"

# Binary installer bootstrapped from its attested GitHub release via mise's registry
cargo-binstall = "1.22.0"

# Release tooling installed from attested GitHub artifacts
"github:PyO3/maturin" = "1.14.1"

# Development tools installed via cargo-binstall
"cargo:cargo-zigbuild" = "0.23.0"

# Zig for cross-compilation
zig = "0.15.2"

[settings]
experimental = true
idiomatic_version_file_enable_tools = ["rust"]
cargo.binstall = true

[tasks.setup]
description = "Set up the development environment"
run = """
echo "Setting up upd development environment..."
mise install rust python uv actionlint zig
mise install github:PyO3/maturin
mise install cargo-binstall
mise install cargo:cargo-zigbuild
uv tool install twine
echo "Setup complete!"
mise list
"""

[tasks.verify]
description = "Verify all tools are installed"
run = """
echo "Rust: $(rustc --version)"
echo "Cargo: $(cargo --version)"
echo "Python: $(python --version)"
echo "maturin: $(maturin --version)"
"""
