# Reusable GitLab CI template that keeps one rolling dependency merge request
# in every project of a group that opts in. Include this file from a pinned upd
# commit in one central project, configure its typed inputs, then extend
# `.upd-organization-update`. See docs/gitlab.md#organization-mode.
#
# With the lock input on, also extend `.upd-organization-lock-plan` and
# `.upd-organization-lock`: the organization job then only plans, and a child pipeline regenerates
# lockfiles in jobs that never hold the token (GitLab 18.2 or later). See
# docs/gitlab.md#lockfiles-in-organization-mode.

spec:
  inputs:
    group:
      description: Full path or numeric ID of the group whose projects are updated, subgroups included
      regex: '^[0-9A-Za-z_.][0-9A-Za-z_./-]*$'
    stage:
      description: Existing pipeline stage for the organization job
      default: test
    image:
      description: Compatible Linux job image; pin custom images by digest
      default: "debian:bookworm-slim@sha256:abd67ffcfa541b485a3dff59865ab629aa048a6c613e639d36e7456b0b229241"
    upd_version:
      description: Exact released upd version
      default: "v0.15.1"
      regex: '^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$'
    upd_sha256:
      description: Archive digest; required when overriding upd_version or upd_target
      default: ""
      regex: '^$|^[0-9a-fA-F]{64}$'
    upd_target:
      description: Release target; detected for supported Linux runners when empty
      default: ""
      regex: '^$|^[0-9A-Za-z_.+-]+$'
    exclude:
      description: Whitespace-separated globs of project paths to leave alone
      default: ""
    langs:
      description: Comma-separated ecosystem filter applied to every project
      default: ""
    min_age:
      description: Shortest release age any project accepts; longer project cooldowns still apply
      default: "7d"
    max_bump:
      description: Highest applied bump in every project; empty uses each project's configuration
      default: "minor"
    branch:
      description: Automation-owned rolling branch in each project
      default: "automation/upd-dependencies"
    commit_message:
      description: Conventional Commits message for the generated commits
      default: "chore(deps): update dependencies with upd"
    auto_merge:
      description: Allow auto-merge in projects that also set [automation] auto_merge = true
      type: boolean
      default: false
    major_mr:
      description: Also propose major-version upgrades, in projects that also set [automation] major_mr = true, on a second merge request upd never merges
      type: boolean
      default: false
    security_remediation:
      description: First move dependencies with a published advisory to the lowest release that resolves it, in projects that also set [automation] security_remediation = true
      type: boolean
      default: true
    major_branch:
      description: Automation-owned rolling branch for the major-upgrade merge request
      default: "automation/upd-dependencies-major"
    major_commit_message:
      description: Conventional Commits message for the major-upgrade commit
      default: "chore(deps): update major dependencies with upd"
    concurrency:
      description: Projects processed at the same time (1 to 16)
      type: number
      default: 4
    dry_run:
      description: Report what each project would get without pushing or writing to GitLab
      type: boolean
      default: false
    environment:
      description: Environment the token variable is scoped to; only jobs that need the token declare it
      default: "upd-organization"
      regex: '^[0-9A-Za-z_-][0-9A-Za-z _/-]*$'
    lock:
      description: Regenerate lockfiles, in projects that also set [automation] lock = true, in a child pipeline whose lock jobs never hold the token; requires extending .upd-organization-lock-plan and .upd-organization-lock
      type: boolean
      default: false
    lock_runner_tags:
      description: Comma-separated tags of the runners reserved for lock jobs, which run project code; required with lock
      default: ""
      regex: '^[^$]*$'
    runner_tags:
      description: Comma-separated tags of the runners for the child pipeline's jobs that hold the token; empty for any runner
      default: ""
      regex: '^[^$]*$'
    lock_image:
      description: Job image carrying the lock tools (uv, npm, cargo) for lock jobs; empty uses image
      default: ""
      regex: '^[^$ ]*$'
    organization_job:
      description: Name of the job that extends .upd-organization-update, whose artifacts the lock pipeline runs from
      default: "upd-organization-update"
      regex: '^[0-9A-Za-z_.-][0-9A-Za-z_. /-]*$'
    lock_plan_job:
      description: Name of the job that extends .upd-organization-lock-plan, whose artifacts the lock pipeline is included from
      default: "upd-organization-lock-plan"
      regex: '^[0-9A-Za-z_.-][0-9A-Za-z_. /-]*$'
---

.upd-organization-update:
  image: "$[[ inputs.image ]]"
  stage: "$[[ inputs.stage ]]"
  timeout: 2h
  interruptible: false
  resource_group: upd-organization-update
  environment:
    name: "$[[ inputs.environment ]]"
    action: access
  artifacts:
    when: always
    expire_in: 1 week
    access: developer
    paths:
      - .upd-ci/
  variables:
    UPD_VERSION: "$[[ inputs.upd_version ]]"
    UPD_SHA256: "$[[ inputs.upd_sha256 ]]"
    UPD_TARGET: "$[[ inputs.upd_target ]]"
    UPD_GROUP: "$[[ inputs.group ]]"
    UPD_EXCLUDE: "$[[ inputs.exclude ]]"
    UPD_LANGS: "$[[ inputs.langs ]]"
    UPD_MIN_AGE: "$[[ inputs.min_age ]]"
    UPD_MAX_BUMP: "$[[ inputs.max_bump ]]"
    UPD_BRANCH: "$[[ inputs.branch ]]"
    UPD_COMMIT_MESSAGE: "$[[ inputs.commit_message ]]"
    UPD_GIT_NAME: "upd automation"
    UPD_GIT_EMAIL: "upd-automation@noreply.invalid"
    UPD_AUTO_MERGE: "$[[ inputs.auto_merge ]]"
    UPD_MAJOR_MR: "$[[ inputs.major_mr ]]"
    UPD_SECURITY_REMEDIATION: "$[[ inputs.security_remediation ]]"
    UPD_MAJOR_BRANCH: "$[[ inputs.major_branch ]]"
    UPD_MAJOR_COMMIT_MESSAGE: "$[[ inputs.major_commit_message ]]"
    UPD_CONCURRENCY: "$[[ inputs.concurrency ]]"
    UPD_DRY_RUN: "$[[ inputs.dry_run ]]"
    UPD_LOCK: "$[[ inputs.lock ]]"
    UPD_ENVIRONMENT: "$[[ inputs.environment ]]"
    UPD_IMAGE: "$[[ inputs.image ]]"
    UPD_LOCK_IMAGE: "$[[ inputs.lock_image ]]"
    UPD_RUNNER_TAGS: "$[[ inputs.runner_tags ]]"
    UPD_LOCK_RUNNER_TAGS: "$[[ inputs.lock_runner_tags ]]"
    UPD_ORGANIZATION_JOB: "$[[ inputs.organization_job ]]"
    # Test/advanced escape hatch. Normal jobs always install a released binary.
    UPD_EXECUTABLE: ""
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never
  before_script:
    - |
      missing=""
      for tool in bash curl cut git grep mktemp sha256sum tar tr uname; do
        command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
      done
      if [ -n "$missing" ]; then
        if command -v apt-get >/dev/null 2>&1; then
          apt-get update
          apt-get install --yes --no-install-recommends bash ca-certificates coreutils curl git grep tar
        elif command -v apk >/dev/null 2>&1; then
          apk add --no-cache bash ca-certificates coreutils curl git tar
        else
          echo "Missing required commands:$missing" >&2
          echo "Use a compatible image or install them in before_script." >&2
          exit 2
        fi
      fi
  script:
    - |
      bash <<'UPD_JOB'
      set -euo pipefail

      work_dir="$(mktemp -d)"
      trap 'rm -rf "$work_dir"' EXIT

      version="${UPD_VERSION}"
      case "$version" in
        v*) ;;
        *) version="v${version}" ;;
      esac

      if [ -n "$UPD_EXECUTABLE" ]; then
        upd_bin="$UPD_EXECUTABLE"
      else
        target="${UPD_TARGET}"
        if [ -z "$target" ]; then
          case "$(uname -m)" in
            x86_64|amd64) target="x86_64-unknown-linux-gnu" ;;
            aarch64|arm64) target="aarch64-unknown-linux-gnu" ;;
            *)
              echo "Unsupported runner architecture: $(uname -m); set upd_target explicitly" >&2
              exit 4
              ;;
          esac
        fi

        expected_sha="${UPD_SHA256}"
        if [ -z "$expected_sha" ] && [ "$version" = "v0.15.1" ]; then
          case "$target" in
            x86_64-unknown-linux-gnu)
              expected_sha="d3de7abc9343494bd3645e2272e5286f75df7671690460af1cf9d1df9e5cd6ab"
              ;;
            x86_64-unknown-linux-musl)
              expected_sha="63fe74d8a7e200107d6bc9dbcef2a8d798d690d1aab90aaf35d13ed7233636d4"
              ;;
            aarch64-unknown-linux-gnu)
              expected_sha="c92fa6f9110d3dfca52fe72e4fd3f9902a7f38f111f513a07dab18273117ce09"
              ;;
          esac
        fi
        if ! printf '%s\n' "$expected_sha" | grep --extended-regexp --quiet '^[0-9a-fA-F]{64}$'; then
          echo "Set upd_sha256 when overriding upd_version or upd_target" >&2
          exit 4
        fi

        asset="upd-${version}-${target}.tar.gz"
        release_url="https://github.com/rvben/upd/releases/download/${version}"
        curl --silent --show-error --fail-with-body --location \
          --output "$work_dir/$asset" "$release_url/$asset"
        actual_sha="$(sha256sum "$work_dir/$asset" | cut -d ' ' -f 1)"
        if [ "$(printf '%s' "$actual_sha" | tr 'A-F' 'a-f')" != \
          "$(printf '%s' "$expected_sha" | tr 'A-F' 'a-f')" ]; then
          echo "Checksum verification failed for $asset" >&2
          exit 2
        fi
        tar --extract --gzip --file "$work_dir/$asset" --directory "$work_dir" upd
        chmod 0755 "$work_dir/upd"
        upd_bin="$work_dir/upd"
      fi

      if [ ! -x "$upd_bin" ]; then
        echo "upd executable is missing or not executable: $upd_bin" >&2
        exit 2
      fi

      # upd owns the rest of the job: discovery, opt-in, and for each opted-in
      # project the branch ownership check, update, lease-protected push and
      # merge request. Progress goes to the job log; the JSON report is kept
      # as an artifact. In lock mode this job only plans: it writes the child
      # pipeline, which .upd-organization-lock-plan passes on for
      # .upd-organization-lock to start, and the binary its jobs run.
      if [ "$UPD_LOCK" = "true" ]; then
        # A release from before lock mode has no plan command, and reads
        # `plan` as a project path: it prints the help of `gitlab org`
        # itself. Asking the binary holds for the default release and an
        # overridden one.
        plan_help="$("$upd_bin" gitlab org plan --help 2>&1 || true)"
        case "$plan_help" in
          *" gitlab org plan "*) ;;
          *)
            echo "upd ${version} has no lock mode; set upd_version and upd_sha256 to a release that has 'upd gitlab org plan'" >&2
            exit 4
            ;;
        esac
        args=(gitlab org plan --output json)
        report=.upd-ci/upd-org-plan.json
      else
        args=(gitlab org run --output json)
        report=.upd-ci/upd-org-report.json
      fi
      if [ "$UPD_DRY_RUN" = "true" ]; then
        args+=(--dry-run)
      fi
      mkdir -p .upd-ci
      status=0
      "$upd_bin" "${args[@]}" > "$report" || status=$?
      exit "$status"
      UPD_JOB

# Keeps the lock pipeline the organization job planned as an artifact of
# its own. GitLab includes a pipeline only from an artifact archive of at
# most 5 MiB by default, and the organization job's archive also carries the
# upd binary the child jobs run.
.upd-organization-lock-plan:
  image: "$[[ inputs.image ]]"
  stage: "$[[ inputs.stage ]]"
  needs:
    - job: "$[[ inputs.organization_job ]]"
      artifacts: true
  artifacts:
    expire_in: 1 day
    access: developer
    paths:
      - .upd-ci/upd-lock-pipeline.yml
  variables:
    GIT_STRATEGY: empty
    UPD_LOCK: "$[[ inputs.lock ]]"
    UPD_LOCK_PLAN_JOB: "$[[ inputs.lock_plan_job ]]"
  rules:
    - if: '$UPD_LOCK != "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never
  script:
    - |
      if [ "$CI_JOB_NAME" != "$UPD_LOCK_PLAN_JOB" ]; then
        echo "The lock_plan_job input names $UPD_LOCK_PLAN_JOB, but this job is $CI_JOB_NAME; set lock_plan_job to the name of the job that extends .upd-organization-lock-plan, so the trigger job finds its artifacts" >&2
        exit 2
      fi
      if [ ! -f .upd-ci/upd-lock-pipeline.yml ]; then
        echo "The organization job wrote no lock pipeline" >&2
        exit 2
      fi

# Starts the lock pipeline the organization job planned. It holds the
# organization's resource group until that pipeline finishes, so runs never
# overlap, and forwards no variables: each child job sets the settings the
# plan read in its own script, where no CI/CD variable can override them.
.upd-organization-lock:
  stage: "$[[ inputs.stage ]]"
  needs:
    - job: "$[[ inputs.lock_plan_job ]]"
      artifacts: true
  resource_group: upd-organization-update
  variables:
    UPD_LOCK: "$[[ inputs.lock ]]"
  rules:
    - if: '$UPD_LOCK != "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never
  trigger:
    include:
      - artifact: .upd-ci/upd-lock-pipeline.yml
        job: "$[[ inputs.lock_plan_job ]]"
    strategy: mirror
    forward:
      yaml_variables: false
      pipeline_variables: false
