# Reusable GitLab CI template for one rolling dependency merge request.
# Include this file from a pinned upd commit, configure its typed inputs, then
# extend `.upd-dependency-update`. See docs/gitlab.md.

spec:
  inputs:
    stage:
      description: Existing pipeline stage for the dependency-update job
      default: test
    image:
      description: Compatible Linux job image; pin custom images by digest
      default: "debian:bookworm-slim@sha256:abd67ffcfa541b485a3dff59865ab629aa048a6c613e639d36e7456b0b229241"
    upd_version:
      description: Exact released upd version
      default: "v0.8.7"
      regex: '^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$'
    upd_sha256:
      description: Archive digest; required when overriding upd_version or upd_target
      default: ""
      regex: '^$|^[0-9a-fA-F]{64}$'
    upd_target:
      description: Release target; detected for supported Linux runners when empty
      default: ""
      regex: '^$|^[0-9A-Za-z_.+-]+$'
    paths:
      description: Whitespace-separated repository paths passed to upd
      default: "."
    langs:
      description: Comma-separated ecosystem filter
      default: ""
    packages:
      description: Comma-separated package filter
      default: ""
    min_age:
      description: Minimum eligible release age; empty uses repository configuration
      default: "7d"
    max_bump:
      description: Highest applied bump; empty uses repository configuration
      default: "minor"
    lock:
      description: Regenerate lockfiles; requires ecosystem tools in the job image
      type: boolean
      default: false
    prepare_command:
      description: Command that installs or prepares repository-specific tooling
      default: ""
    validation_command:
      description: Command run after updates and before publishing
      default: ""
    branch:
      description: Automation-owned rolling branch
      default: "automation/upd-dependencies"
    commit_message:
      description: Conventional Commits message for the generated commit
      default: "chore(deps): update dependencies with upd"
    mr_title:
      description: Merge-request title override; empty derives a concise title from the update evidence
      default: ""
    auto_merge:
      description: Ask GitLab to merge after all project checks pass
      type: boolean
      default: false
---

.upd-dependency-update:
  image: "$[[ inputs.image ]]"
  stage: "$[[ inputs.stage ]]"
  timeout: 30m
  interruptible: false
  resource_group: upd-dependency-update
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - .upd-ci/
  variables:
    UPD_VERSION: "$[[ inputs.upd_version ]]"
    UPD_SHA256: "$[[ inputs.upd_sha256 ]]"
    UPD_TARGET: "$[[ inputs.upd_target ]]"
    UPD_PATHS: "$[[ inputs.paths ]]"
    UPD_LANGS: "$[[ inputs.langs ]]"
    UPD_PACKAGES: "$[[ inputs.packages ]]"
    UPD_MIN_AGE: "$[[ inputs.min_age ]]"
    UPD_MAX_BUMP: "$[[ inputs.max_bump ]]"
    UPD_LOCK: "$[[ inputs.lock ]]"
    UPD_PREPARE_COMMAND: "$[[ inputs.prepare_command ]]"
    UPD_VALIDATION_COMMAND: "$[[ inputs.validation_command ]]"
    UPD_BRANCH: "$[[ inputs.branch ]]"
    UPD_COMMIT_MESSAGE: "$[[ inputs.commit_message ]]"
    UPD_MR_TITLE: "$[[ inputs.mr_title ]]"
    UPD_GIT_NAME: "upd automation"
    UPD_GIT_EMAIL: "upd-automation@noreply.invalid"
    UPD_AUTO_MERGE: "$[[ inputs.auto_merge ]]"
    # Test/advanced escape hatch. Normal jobs always install a released binary.
    UPD_EXECUTABLE: ""
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never
  before_script:
    - |
      missing=""
      for tool in bash curl cut git grep jq mktemp mv sha256sum tar tr uname wc; do
        command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
      done
      if [ -n "$missing" ]; then
        if command -v apt-get >/dev/null 2>&1; then
          apt-get update
          apt-get install --yes --no-install-recommends bash ca-certificates coreutils curl git grep jq tar
        elif command -v apk >/dev/null 2>&1; then
          apk add --no-cache bash ca-certificates coreutils curl git jq tar
        else
          echo "Missing required commands:$missing" >&2
          echo "Use a compatible image or install them in before_script." >&2
          exit 2
        fi
      fi
  script:
    - |
      bash <<'UPD_JOB'
      set -euo pipefail

      : "${UPD_GITLAB_TOKEN:?Set the masked, protected UPD_GITLAB_TOKEN CI/CD variable}"
      : "${CI_API_V4_URL:?GitLab did not provide CI_API_V4_URL}"
      : "${CI_DEFAULT_BRANCH:?GitLab did not provide CI_DEFAULT_BRANCH}"
      : "${CI_PROJECT_DIR:?GitLab did not provide CI_PROJECT_DIR}"
      : "${CI_PROJECT_ID:?GitLab did not provide CI_PROJECT_ID}"
      : "${CI_PROJECT_PATH:?GitLab did not provide CI_PROJECT_PATH}"
      : "${CI_SERVER_URL:?GitLab did not provide CI_SERVER_URL}"

      case "${UPD_LOCK}" in
        true|false) ;;
        *) echo "UPD_LOCK must be true or false" >&2; exit 4 ;;
      esac
      case "${UPD_AUTO_MERGE}" in
        true|false) ;;
        *) echo "UPD_AUTO_MERGE must be true or false" >&2; exit 4 ;;
      esac
      if ! git check-ref-format --branch "$UPD_BRANCH" >/dev/null 2>&1; then
        echo "Invalid automation branch: $UPD_BRANCH" >&2
        exit 4
      fi
      if [ "$UPD_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        echo "The automation branch must differ from the default branch" >&2
        exit 4
      fi

      work_dir="$(mktemp -d)"
      trap 'rm -rf "$work_dir"' EXIT
      mkdir -p "$CI_PROJECT_DIR/.upd-ci"
      printf '%s\n' '/.upd-ci/' >> .git/info/exclude
      report="$CI_PROJECT_DIR/.upd-ci/upd-report.json"

      version="${UPD_VERSION}"
      case "$version" in
        v*) ;;
        *) version="v${version}" ;;
      esac

      if [ -n "$UPD_EXECUTABLE" ]; then
        upd_bin="$UPD_EXECUTABLE"
      else
        target="${UPD_TARGET}"
        if [ -z "$target" ]; then
          case "$(uname -m)" in
            x86_64|amd64) target="x86_64-unknown-linux-gnu" ;;
            aarch64|arm64) target="aarch64-unknown-linux-gnu" ;;
            *)
              echo "Unsupported runner architecture: $(uname -m); set upd_target explicitly" >&2
              exit 4
              ;;
          esac
        fi

        expected_sha="${UPD_SHA256}"
        if [ -z "$expected_sha" ] && [ "$version" = "v0.8.7" ]; then
          case "$target" in
            x86_64-unknown-linux-gnu)
              expected_sha="d48f5252383aff235e32b0b04530f07beb9237c62dec0a784451edcd8022f14e"
              ;;
            x86_64-unknown-linux-musl)
              expected_sha="414d82cdb308db6ff5bf2ddb4180f5e1a83f5037d253078688a92d0d3995dd38"
              ;;
            aarch64-unknown-linux-gnu)
              expected_sha="1489ce638e50819fa51f43b5d631fc4ad7d57d0eb845d5b73b0b36741bec3f87"
              ;;
          esac
        fi
        if ! printf '%s\n' "$expected_sha" | grep --extended-regexp --quiet '^[0-9a-fA-F]{64}$'; then
          echo "Set upd_sha256 when overriding upd_version or upd_target" >&2
          exit 4
        fi

        asset="upd-${version}-${target}.tar.gz"
        release_url="https://github.com/rvben/upd/releases/download/${version}"
        curl --silent --show-error --fail-with-body --location \
          --output "$work_dir/$asset" "$release_url/$asset"
        actual_sha="$(sha256sum "$work_dir/$asset" | cut -d ' ' -f 1)"
        if [ "$(printf '%s' "$actual_sha" | tr 'A-F' 'a-f')" != \
          "$(printf '%s' "$expected_sha" | tr 'A-F' 'a-f')" ]; then
          echo "Checksum verification failed for $asset" >&2
          exit 2
        fi
        tar --extract --gzip --file "$work_dir/$asset" --directory "$work_dir" upd
        chmod 0755 "$work_dir/upd"
        upd_bin="$work_dir/upd"
      fi

      if [ ! -x "$upd_bin" ]; then
        echo "upd executable is missing or not executable: $upd_bin" >&2
        exit 2
      fi

      askpass="$work_dir/git-askpass"
      cat > "$askpass" <<'ASKPASS'
      #!/bin/sh
      case "$1" in
        Username*) printf '%s\n' oauth2 ;;
        *) printf '%s\n' "$UPD_GITLAB_TOKEN" ;;
      esac
      ASKPASS
      chmod 0700 "$askpass"
      export GIT_ASKPASS="$askpass"
      export GIT_TERMINAL_PROMPT=0

      git_url="${CI_SERVER_URL}/${CI_PROJECT_PATH}.git"
      mr_api="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests"
      gitlab_api() {
        curl --silent --show-error --fail-with-body \
          --header "PRIVATE-TOKEN: ${UPD_GITLAB_TOKEN}" "$@"
      }
      find_open_mrs() {
        gitlab_api --get \
          --data-urlencode "state=opened" \
          --data-urlencode "source_branch=${UPD_BRANCH}" \
          --data-urlencode "target_branch=${CI_DEFAULT_BRANCH}" \
          "$mr_api"
      }

      git fetch --no-tags "$git_url" \
        "+refs/heads/${CI_DEFAULT_BRANCH}:refs/remotes/origin/${CI_DEFAULT_BRANCH}"
      if git fetch --no-tags "$git_url" \
        "+refs/heads/${UPD_BRANCH}:refs/remotes/origin/${UPD_BRANCH}"; then
        expected_remote_sha="$(git rev-parse "refs/remotes/origin/${UPD_BRANCH}")"
      else
        expected_remote_sha=""
      fi
      git switch --force-create "$UPD_BRANCH" "refs/remotes/origin/${CI_DEFAULT_BRANCH}"

      if [ -n "$UPD_PREPARE_COMMAND" ]; then
        bash -euo pipefail -c "$UPD_PREPARE_COMMAND"
      fi
      if [ -n "$(git status --porcelain)" ]; then
        echo "The prepare command changed repository files; refusing to mix setup with updates" >&2
        exit 2
      fi

      upd_args=(update --apply --format json)
      if [ "$UPD_LOCK" = "true" ]; then
        upd_args+=(--lock)
      fi
      if [ -n "$UPD_MIN_AGE" ]; then
        upd_args+=(--min-age "$UPD_MIN_AGE")
      fi
      if [ -n "$UPD_MAX_BUMP" ]; then
        upd_args+=(--max-bump "$UPD_MAX_BUMP")
      fi
      if [ -n "$UPD_LANGS" ]; then
        upd_args+=(--lang "$UPD_LANGS")
      fi
      if [ -n "$UPD_PACKAGES" ]; then
        upd_args+=(--package "$UPD_PACKAGES")
      fi
      read -r -a upd_paths <<< "${UPD_PATHS:-.}"

      "$upd_bin" "${upd_args[@]}" "${upd_paths[@]}" > "$report"
      jq --exit-status . "$report" >/dev/null
      jq --raw-output '
        "upd: \(.summary.updates_total) update(s), " +
        "\(.summary.files_with_changes) changed file(s), " +
        "\(.summary.held_back // 0) held back, " +
        "\(.summary.capped // 0) capped, " +
        "\(.summary.errors) error(s)"
      ' "$report"
      if ! jq --exit-status '(.summary.errors // 0) == 0' "$report" >/dev/null; then
        echo "upd reported errors; refusing to publish a partial result" >&2
        exit 2
      fi

      git add --all
      changed=true
      if git diff --cached --quiet; then
        changed=false
      fi
      mapfile -t changed_paths < <(git diff --cached --name-only)
      changed_paths_json="$(printf '%s\n' "${changed_paths[@]}" | jq --raw-input --slurp 'split("\n") | map(select(length > 0))')"
      validation_configured=false
      if [ -n "$UPD_VALIDATION_COMMAND" ]; then
        validation_configured=true
      fi

      # Keep this schema aligned with the GitHub workflow. The raw upd report
      # remains canonical; this bounded model exists only for review UX.
      presentation="$CI_PROJECT_DIR/.upd-ci/upd-presentation.json"
      jq \
        --arg min_age "$UPD_MIN_AGE" \
        --arg max_bump "$UPD_MAX_BUMP" \
        --argjson auto_merge "$UPD_AUTO_MERGE" \
        --argjson changed "$changed" \
        --argjson changed_paths "$changed_paths_json" \
        --argjson lock "$UPD_LOCK" \
        --argjson validation_configured "$validation_configured" '
        def clean($limit):
          if . == null then "" else tostring end
          | gsub("[\\x00-\\x1f\\x7f\u202a-\u202e\u2066-\u2069]"; " ")
          | gsub("[[:space:]]+"; " ")
          | sub("^ "; "") | sub(" $"; "")
          | .[0:$limit];
        def update_rows:
          [.files[]? as $file
           | $file.updates[]?
           | select(.status == null or .status == "applied" or .status == "pending_relock")
           | {
               package: (.package // "unknown dependency" | clean(160)),
               current: (.current // "unknown" | clean(160)),
               latest: (.latest // "unknown" | clean(160)),
               bump: (.bump // "unknown" | clean(32)),
               path: ($file.path // "unknown file" | clean(160)),
               status: (.status // "applied" | clean(32))
             }]
          | unique_by([.package, .current, .latest, .path, .status])
          | sort_by([.package, .path, .current, .latest]);
        def annotation_rows:
          [.files[]? as $file | $file.annotations[]? | {
            package: (.package // "unknown dependency" | clean(160)),
            version: (.version // "unknown" | clean(160)),
            path: ($file.path // "unknown file" | clean(160))
          }] | unique_by([.package, .version, .path]) | sort_by([.package, .path]);
        def policy_rows:
          [.files[]? as $file |
            (($file.held_back // [])[] | {
              kind: "cooldown", package: (.package // "unknown dependency" | clean(160)),
              selected: (.chosen // .current // "unknown" | clean(160)),
              available: (.skipped_latest // "unknown" | clean(160)),
              path: ($file.path // "unknown file" | clean(160))
            }),
            (($file.skipped_by_cooldown // [])[] | {
              kind: "cooldown", package: (.package // "unknown dependency" | clean(160)),
              selected: (.current // "unknown" | clean(160)),
              available: (.skipped_latest // "unknown" | clean(160)),
              path: ($file.path // "unknown file" | clean(160))
            }),
            (($file.capped // [])[] | {
              kind: "bump ceiling", package: (.package // "unknown dependency" | clean(160)),
              selected: (.current // "unknown" | clean(160)),
              available: (.available // "unknown" | clean(160)),
              path: ($file.path // "unknown file" | clean(160))
            })]
          | unique_by([.kind, .package, .selected, .available, .path])
          | sort_by([.kind, .package, .path]);
        def blocked_rows:
          ([.files[]? as $file | ($file.skipped // [])[]
            | select(.status == "blocked")
            | {
                package: (.package // "unknown dependency" | clean(160)),
                current: (.current // "unknown" | clean(160)),
                reason: (.message // .reason // "blocked by a safety condition" | clean(240)),
                path: ($file.path // "unknown file" | clean(160))
              }]
           +
           [.files[]? as $file | $file.updates[]?
            | select(.status == "unfixable" or .status == "skipped")
            | {
                package: (.package // "unknown dependency" | clean(160)),
                current: (.current // "unknown" | clean(160)),
                reason: (.error // "upd could not apply this update safely" | clean(240)),
                path: ($file.path // "unknown file" | clean(160))
              }])
          | unique_by([.package, .current, .reason, .path])
          | sort_by([.package, .path, .reason]);
        . as $report
        | (update_rows) as $updates
        | (annotation_rows) as $annotations
        | (policy_rows) as $policy_holds
        | (blocked_rows) as $blocked
        | {
            schema: 1,
            state: (if $changed then "ready" elif ($blocked | length) > 0 then "blocked_no_change" else "clean" end),
            changed: $changed,
            updates: $updates,
            annotations: $annotations,
            policy_holds: $policy_holds,
            blocked: $blocked,
            changed_paths: ($changed_paths | map(clean(160)) | unique | sort),
            counts: {
              updates: ($updates | length),
              updates_major: ([$updates[] | select((.bump | ascii_downcase) == "major")] | length),
              updates_minor: ([$updates[] | select((.bump | ascii_downcase) == "minor")] | length),
              updates_patch: ([$updates[] | select((.bump | ascii_downcase) == "patch")] | length),
              updates_review_worthy: ([$updates[] | select((.bump | ascii_downcase) != "patch")] | length),
              updates_quiet: ([$updates[] | select((.bump | ascii_downcase) == "patch")] | length),
              annotations: ($annotations | length),
              files_changed: ($changed_paths | length),
              policy_holds: ($policy_holds | length),
              blocked: ($blocked | length),
              warnings: ($report.summary.warnings // 0),
              not_examined: ($report.summary.not_examined // 0)
            },
            policy: {
              min_age: (if $min_age == "" then "repository configuration" else ($min_age | clean(80)) end),
              max_bump: (if $max_bump == "" then "repository configuration" else ($max_bump | clean(32)) end),
              lockfile_regeneration: $lock
            },
            validation: {
              repository_command_configured: $validation_configured,
              proposal_integrity_passed: ($changed | not)
            },
            auto_merge_requested: $auto_merge
          }
        | (.changed_paths as $paths
           | (($paths | length) > 0 and all($paths[]; startswith(".github/workflows/")))) as $workflow_only
        | (if $workflow_only then "ci(deps)" else "chore(deps)" end) as $title_prefix
        | .title = (
            if .counts.updates == 1 then
              if ((.updates[0].package | test("^[A-Za-z0-9@][A-Za-z0-9._@/+-]{0,79}$")) and
                  (.updates[0].latest | test("^[A-Za-z0-9][A-Za-z0-9._:+-]{0,79}$"))) then
                "\($title_prefix): refresh \(.updates[0].package) to \(.updates[0].latest)"
              else
                "\($title_prefix): refresh dependency"
              end
            elif .counts.updates > 1 then
              "\($title_prefix): refresh \(.counts.updates) dependencies"
            elif .counts.annotations == 1 then
              "\($title_prefix): annotate dependency metadata"
            elif .counts.annotations > 1 then
              "\($title_prefix): annotate \(.counts.annotations) dependency declarations"
            else
              "\($title_prefix): refresh dependency metadata"
            end
            | clean(72)
          )
      ' "$report" > "$presentation"

      if [ "$changed" != "true" ]; then
        echo "No dependency updates within policy."
        mr_list="$(find_open_mrs)"
        mr_count="$(jq 'length' <<< "$mr_list")"
        if [ "$mr_count" -gt 1 ]; then
          echo "More than one open upd merge request uses ${UPD_BRANCH}; refusing to choose one" >&2
          exit 2
        fi
        if [ "$mr_count" -eq 1 ]; then
          mr_iid="$(jq --raw-output '.[0].iid' <<< "$mr_list")"
          mr_url="$(jq --raw-output '.[0].web_url' <<< "$mr_list")"
          gitlab_api --request PUT --form "state_event=close" \
            "$mr_api/$mr_iid" >/dev/null
          echo "Closed obsolete merge request: $mr_url"
        fi
        if [ -n "$expected_remote_sha" ]; then
          git push \
            --force-with-lease="refs/heads/${UPD_BRANCH}:${expected_remote_sha}" \
            "$git_url" ":refs/heads/${UPD_BRANCH}"
          echo "Removed obsolete automation branch: $UPD_BRANCH"
        fi
        exit 0
      fi

      if [ -n "$UPD_VALIDATION_COMMAND" ]; then
        bash -euo pipefail -c "$UPD_VALIDATION_COMMAND"
      fi
      if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
        echo "Validation changed uncommitted files; refusing to publish an unvalidated diff" >&2
        exit 2
      fi
      jq '.validation.proposal_integrity_passed = true' "$presentation" \
        > "$work_dir/validated-presentation.json"
      mv "$work_dir/validated-presentation.json" "$presentation"

      git config user.name "$UPD_GIT_NAME"
      git config user.email "$UPD_GIT_EMAIL"
      git commit --message "$UPD_COMMIT_MESSAGE"
      commit_sha="$(git rev-parse HEAD)"
      git push \
        --force-with-lease="refs/heads/${UPD_BRANCH}:${expected_remote_sha}" \
        "$git_url" "HEAD:refs/heads/${UPD_BRANCH}"

      mr_list="$(find_open_mrs)"
      mr_count="$(jq 'length' <<< "$mr_list")"
      if [ "$mr_count" -gt 1 ]; then
        echo "More than one open upd merge request uses ${UPD_BRANCH}; refusing to choose one" >&2
        exit 2
      fi

      mr_title="$UPD_MR_TITLE"
      if [ -z "$mr_title" ]; then
        mr_title="$(jq --raw-output '.title' "$presentation")"
      fi

      description="$CI_PROJECT_DIR/.upd-ci/upd-mr-description.md"
      jq --raw-output '
        def md:
          tostring | @html
          | gsub("`"; "&#96;") | gsub("\\*"; "&#42;") | gsub("_"; "&#95;")
          | gsub("\\["; "&#91;") | gsub("\\]"; "&#93;") | gsub("\\|"; "&#124;")
          | gsub("\\\\"; "&#92;");
        def code: "<code>\(. | md)</code>";
        def plural($count; $one; $many): if $count == 1 then $one else $many end;
        def scope:
          if .counts.files_changed == 0 then "No repository files changed"
          elif .counts.files_changed <= 3 then (.changed_paths | map(code) | join(", "))
          else "\(.changed_paths[:3] | map(code) | join(", ")) and \(.counts.files_changed - 3) more"
          end;
        def result_summary:
          if .counts.updates > 0 then
            "\(.counts.updates) dependency \(plural(.counts.updates; "update"; "updates"))"
          else
            "\(.counts.annotations) dependency metadata \(plural(.counts.annotations; "annotation"; "annotations"))"
          end;
        def review_updates: [.updates[] | select((.bump | ascii_downcase) != "patch")];
        def quiet_updates: [.updates[] | select((.bump | ascii_downcase) == "patch")];
        def validation_phrase:
          if .validation.repository_command_configured then
            "passed project validation and proposal-integrity checks"
          else
            "passed proposal-integrity checks"
          end;
        def version_boundary:
          if .counts.updates_major == 0 then "No major-version jumps."
          else "Includes \(.counts.updates_major) major-version \(plural(.counts.updates_major; "jump"; "jumps"))."
          end;
        def brand:
          "<p><a href=\"https://github.com/rvben/upd\"><img src=\"https://raw.githubusercontent.com/rvben/upd/84109eaf36c739dc11af0452c6218abb7e47a8e3/assets/logo-wide.svg\" alt=\"upd\" width=\"96\"></a></p>";
        def header:
          if .counts.blocked > 0 then
            "> **A careful upgrade, with follow-up.** upd prepared \(result_summary) across \(.counts.files_changed) \(plural(.counts.files_changed; "file"; "files")) and \(validation_phrase). It stopped short of \(.counts.blocked) \(plural(.counts.blocked; "dependency"; "dependencies")) it could not change safely."
          else
            "> **A tidy upgrade, already prepared.** upd moved \(result_summary) forward across \(.counts.files_changed) \(plural(.counts.files_changed; "file"; "files")) and \(validation_phrase). \(version_boundary)"
          end;
        def facts:
          (["\(.counts.updates) moved forward"]
           + (if .counts.updates_review_worthy > 0 then ["\(.counts.updates_review_worthy) worth a look"] else [] end)
           + (if .counts.updates_quiet > 0 then ["\(.counts.updates_quiet) quiet \(plural(.counts.updates_quiet; "patch"; "patches"))"] else [] end)
           + (if .counts.policy_holds > 0 then ["\(.counts.policy_holds) saved for later"] else [] end)
           + (if .counts.blocked > 0 then ["\(.counts.blocked) \(plural(.counts.blocked; "needs"; "need")) attention"] else [] end))
          | map("**\(.)**") | join(" · ");
        def changes:
          (review_updates) as $review
          | (quiet_updates) as $quiet
          | (if ($review | length) > 0 then
               "### Worth a look\n\nYour attention is best spent on these non-patch updates.\n\n" +
               "| Dependency | Before | After | Change | File |\n|---|---:|---:|---|---|\n" +
               ($review[:12] | map("| \(.package | code) | \(.current | code) | \(.latest | code) | \(.bump | md) | \(.path | code) |") | join("\n")) +
               (if ($review | length) > 12 then "\n\n_\(($review | length) - 12) more review-worthy updates are preserved in the pipeline artifact._" else "" end)
             elif .counts.updates > 0 then
               "### What changed\n\n" +
               "| Dependency | Before | After | Change | File |\n|---|---:|---:|---|---|\n" +
               (.updates[:12] | map("| \(.package | code) | \(.current | code) | \(.latest | code) | \(.bump | md) | \(.path | code) |") | join("\n")) +
               (if .counts.updates > 12 then "\n\n_\(.counts.updates - 12) more updates are preserved in the pipeline artifact._" else "" end)
             else
               "### What changed\n\nupd added or refreshed dependency metadata without changing selected versions."
             end) +
          (if (($review | length) > 0 and ($quiet | length) > 0) then
             "\n\n<details>\n<summary><strong>Quiet patch updates (\($quiet | length))</strong></summary>\n\n" +
             "| Dependency | Before | After | File |\n|---|---:|---:|---|\n" +
             ($quiet[:20] | map("| \(.package | code) | \(.current | code) | \(.latest | code) | \(.path | code) |") | join("\n")) +
             (if ($quiet | length) > 20 then "\n\n_\(($quiet | length) - 20) more patch updates are preserved in the pipeline artifact._" else "" end) +
             "\n\n</details>"
           else "" end) +
          (if .counts.annotations > 0 then
             "\n\n<details>\n<summary><strong>Dependency metadata (\(.counts.annotations))</strong></summary>\n\n" +
             "| Dependency | Version | File |\n|---|---:|---|\n" +
             (.annotations[:20] | map("| \(.package | code) | \(.version | code) | \(.path | code) |") | join("\n")) +
             "\n\n</details>"
           else "" end);
        def held:
          if .counts.policy_holds == 0 then ""
          else
            "\n\n<details>\n<summary><strong>Saved for a deliberate upgrade (\(.counts.policy_holds))</strong></summary>\n\n" +
            "upd left these releases unchanged because they sit outside this project\u2019s current update policy.\n\n" +
            "| Dependency | Selected | Available | Policy | File |\n|---|---:|---:|---|---|\n" +
            (.policy_holds[:20] | map("| \(.package | code) | \(.selected | code) | \(.available | code) | \(.kind | md) | \(.path | code) |") | join("\n")) +
            (if .counts.policy_holds > 20 then "\n\n_\(.counts.policy_holds - 20) more policy decisions are preserved in the pipeline artifact._" else "" end) +
            "\n\n</details>"
          end;
        def blocked:
          if .counts.blocked == 0 then ""
          else
            "\n\n### Needs attention\n\n" +
            "> These dependencies were not changed because upd could not do so safely.\n\n" +
            "| Dependency | Current | Reason | File |\n|---|---:|---|---|\n" +
            (.blocked[:12] | map("| \(.package | code) | \(.current | code) | \(.reason | md) | \(.path | code) |") | join("\n")) +
            (if .counts.blocked > 12 then "\n\n_\(.counts.blocked - 12) more blocked decisions are preserved in the pipeline artifact._" else "" end)
          end;
        def evidence:
          "<details>\n<summary><strong>Proof and provenance</strong></summary>\n\n" +
          "- Applied updates: \(.counts.updates)\n" +
          "- Change mix: \(.counts.updates_major) major, \(.counts.updates_minor) minor, \(.counts.updates_patch) patch\n" +
          "- Dependency annotations: \(.counts.annotations)\n" +
          "- Held back by policy: \(.counts.policy_holds)\n" +
          "- Blocked: \(.counts.blocked)\n" +
          "- Not examined: \(.counts.not_examined)\n" +
          "- Warnings: \(.counts.warnings)\n" +
          "- Auto-merge: \(if .auto_merge_requested then "requested; project requirements still control readiness" else "off" end)\n" +
          "- Full update report and presentation model retained in the pipeline artifact\n\n" +
          "</details>";
        def confidence:
          "### \(if (.counts.blocked == 0 and .counts.updates_major == 0 and .validation.repository_command_configured) then "Why this is a comfortable review" else "What upd verified" end)\n\n" +
          "- **Validation:** \(if .validation.repository_command_configured then "Project validation passed" else "No project-specific command was configured" end); proposal integrity passed.\n" +
          "- **Scope:** \(scope).\n" +
          "- **Version boundary:** \(version_boundary)\n" +
          "- **Policy:** Freshness \(.policy.min_age | code); maximum bump \(.policy.max_bump | code); lockfile regeneration \(if .policy.lockfile_regeneration then "on" else "off" end).";
        brand + "\n\n" + header + "\n\n" + facts + "\n\n" + changes + "\n\n" + confidence + held + blocked + "\n\n" + evidence +
        "\n\n> Rebuilt from the latest default branch. The project pipeline remains the final merge boundary." +
        "\n\n---\nPrepared by [upd](https://github.com/rvben/upd)."
      ' "$presentation" > "$description"

      if [ "$(wc -c < "$description")" -gt 32768 ]; then
        jq --raw-output '
          def plural($count; $one; $many): if $count == 1 then $one else $many end;
          def fallback_header:
            if .counts.blocked > 0 then
              "> **A careful upgrade, with follow-up.** upd prepared \(.counts.updates) dependency \(plural(.counts.updates; "update"; "updates")); \(.counts.blocked) \(plural(.counts.blocked; "dependency needs"; "dependencies need")) attention."
            elif .counts.updates_major > 0 then
              "> **A substantial upgrade, prepared for review.** upd moved \(.counts.updates) dependencies forward, including \(.counts.updates_major) major-version \(plural(.counts.updates_major; "jump"; "jumps"))."
            elif .validation.repository_command_configured then
              "> **A tidy upgrade, already prepared.** upd moved \(.counts.updates) dependency \(plural(.counts.updates; "update"; "updates")) forward across \(.counts.files_changed) \(plural(.counts.files_changed; "file"; "files"))."
            else
              "> **A dependency upgrade, prepared for review.** upd moved \(.counts.updates) dependency \(plural(.counts.updates; "update"; "updates")) forward across \(.counts.files_changed) \(plural(.counts.files_changed; "file"; "files"))."
            end;
          "<p><a href=\"https://github.com/rvben/upd\"><img src=\"https://raw.githubusercontent.com/rvben/upd/84109eaf36c739dc11af0452c6218abb7e47a8e3/assets/logo-wide.svg\" alt=\"upd\" width=\"96\"></a></p>\n\n" +
          fallback_header + "\n\n" +
          "- Major-version jumps: \(.counts.updates_major)\n" +
          "- Saved for a deliberate upgrade: \(.counts.policy_holds)\n" +
          "- Needs attention: \(.counts.blocked)\n" +
          "- Validation: \(if .validation.repository_command_configured then "project validation and proposal integrity passed" else "proposal integrity passed; no project-specific command was configured" end)\n\n" +
          "The detailed presentation exceeded the configured body budget, so complete decisions and evidence are retained in the pipeline artifact.\n\n" +
          "> Review the project pipeline before merging."
        ' "$presentation" > "$description"
      fi

      if [ "$mr_count" -eq 0 ]; then
        mr_response="$(
          gitlab_api --request POST \
            --form "source_branch=${UPD_BRANCH}" \
            --form "target_branch=${CI_DEFAULT_BRANCH}" \
            --form "title=${mr_title}" \
            --form "remove_source_branch=true" \
            --form "description=<${description}" \
            "$mr_api"
        )"
      else
        mr_iid="$(jq --raw-output '.[0].iid' <<< "$mr_list")"
        mr_response="$(
          gitlab_api --request PUT \
            --form "title=${mr_title}" \
            --form "description=<${description}" \
            "$mr_api/$mr_iid"
        )"
      fi

      mr_iid="$(jq --raw-output .iid <<< "$mr_response")"
      mr_url="$(jq --raw-output .web_url <<< "$mr_response")"
      if [ "$mr_iid" = "null" ] || [ "$mr_url" = "null" ]; then
        echo "GitLab returned an invalid merge-request response" >&2
        exit 2
      fi
      echo "Merge request: $mr_url"

      if [ "$UPD_AUTO_MERGE" = "true" ]; then
        gitlab_api --request PUT \
          --form "auto_merge=true" \
          --form "sha=${commit_sha}" \
          --form "should_remove_source_branch=true" \
          "$mr_api/$mr_iid/merge" >/dev/null
        echo "GitLab auto-merge enabled for $mr_url"
      elif [ "$(jq --raw-output '.auto_merge_enabled // .merge_when_pipeline_succeeds // false' <<< "$mr_response")" = "true" ]; then
        gitlab_api --request POST \
          "$mr_api/$mr_iid/cancel_merge_when_pipeline_succeeds" >/dev/null
        echo "GitLab auto-merge disabled for $mr_url"
      fi
      UPD_JOB
