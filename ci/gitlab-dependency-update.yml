# Reusable GitLab CI template for one rolling dependency merge request.
# Include this file from a pinned upd commit, configure its typed inputs, then
# extend `.upd-dependency-update`. See docs/gitlab.md.

spec:
  inputs:
    stage:
      description: Existing pipeline stage for the dependency-update job
      default: test
    image:
      description: Compatible Linux job image; pin custom images by digest
      default: "debian:bookworm-slim@sha256:abd67ffcfa541b485a3dff59865ab629aa048a6c613e639d36e7456b0b229241"
    upd_version:
      description: Exact released upd version
      default: "v0.15.0"
      regex: '^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$'
    upd_sha256:
      description: Archive digest; required when overriding upd_version or upd_target
      default: ""
      regex: '^$|^[0-9a-fA-F]{64}$'
    upd_target:
      description: Release target; detected for supported Linux runners when empty
      default: ""
      regex: '^$|^[0-9A-Za-z_.+-]+$'
    paths:
      description: Whitespace-separated repository paths passed to upd
      default: "."
    langs:
      description: Comma-separated ecosystem filter
      default: ""
    packages:
      description: Comma-separated exact-name or case-sensitive glob filter
      default: ""
    min_age:
      description: Minimum eligible release age; empty uses repository configuration
      default: "7d"
    max_bump:
      description: Highest applied bump; empty uses repository configuration
      default: "minor"
    lock:
      description: Regenerate lockfiles; requires ecosystem tools in the job image
      type: boolean
      default: false
    security_remediation:
      description: First move every dependency with a published advisory to the lowest release that resolves it, whatever min_age, max_bump and packages allow
      type: boolean
      default: true
    prepare_command:
      description: Command that installs or prepares repository-specific tooling
      default: ""
    validation_command:
      description: Command run after updates and before publishing
      default: ""
    branch:
      description: Automation-owned rolling branch
      default: "automation/upd-dependencies"
    commit_message:
      description: Conventional Commits message for the generated commit
      default: "chore(deps): update dependencies with upd"
    mr_title:
      description: Merge-request title override; empty derives a concise title from the update evidence
      default: ""
    auto_merge:
      description: Ask GitLab to merge after all project checks pass
      type: boolean
      default: false
    major_mr:
      description: Also propose major-version upgrades on a second merge request that upd never merges; requires a max_bump below major
      type: boolean
      default: false
    major_branch:
      description: Automation-owned rolling branch for the major-upgrade merge request
      default: "automation/upd-dependencies-major"
    major_commit_message:
      description: Conventional Commits message for the major-upgrade commit
      default: "chore(deps): update major dependencies with upd"
---

.upd-dependency-update:
  image: "$[[ inputs.image ]]"
  stage: "$[[ inputs.stage ]]"
  timeout: 30m
  interruptible: false
  resource_group: upd-dependency-update
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - .upd-ci/
  variables:
    UPD_VERSION: "$[[ inputs.upd_version ]]"
    UPD_SHA256: "$[[ inputs.upd_sha256 ]]"
    UPD_TARGET: "$[[ inputs.upd_target ]]"
    UPD_PATHS: "$[[ inputs.paths ]]"
    UPD_LANGS: "$[[ inputs.langs ]]"
    UPD_PACKAGES: "$[[ inputs.packages ]]"
    UPD_MIN_AGE: "$[[ inputs.min_age ]]"
    UPD_MAX_BUMP: "$[[ inputs.max_bump ]]"
    UPD_LOCK: "$[[ inputs.lock ]]"
    UPD_PREPARE_COMMAND: "$[[ inputs.prepare_command ]]"
    UPD_VALIDATION_COMMAND: "$[[ inputs.validation_command ]]"
    UPD_BRANCH: "$[[ inputs.branch ]]"
    UPD_COMMIT_MESSAGE: "$[[ inputs.commit_message ]]"
    UPD_MR_TITLE: "$[[ inputs.mr_title ]]"
    UPD_GIT_NAME: "upd automation"
    UPD_GIT_EMAIL: "upd-automation@noreply.invalid"
    UPD_AUTO_MERGE: "$[[ inputs.auto_merge ]]"
    UPD_SECURITY_REMEDIATION: "$[[ inputs.security_remediation ]]"
    UPD_MAJOR_MR: "$[[ inputs.major_mr ]]"
    UPD_MAJOR_BRANCH: "$[[ inputs.major_branch ]]"
    UPD_MAJOR_COMMIT_MESSAGE: "$[[ inputs.major_commit_message ]]"
    # Test/advanced escape hatch. Normal jobs always install a released binary.
    UPD_EXECUTABLE: ""
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never
  before_script:
    - |
      missing=""
      for tool in bash curl cut git grep mktemp sha256sum tar tr uname; do
        command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
      done
      if [ -n "$missing" ]; then
        if command -v apt-get >/dev/null 2>&1; then
          apt-get update
          apt-get install --yes --no-install-recommends bash ca-certificates coreutils curl git grep tar
        elif command -v apk >/dev/null 2>&1; then
          apk add --no-cache bash ca-certificates coreutils curl git tar
        else
          echo "Missing required commands:$missing" >&2
          echo "Use a compatible image or install them in before_script." >&2
          exit 2
        fi
      fi
  script:
    - |
      bash <<'UPD_JOB'
      set -euo pipefail

      work_dir="$(mktemp -d)"
      trap 'rm -rf "$work_dir"' EXIT

      version="${UPD_VERSION}"
      case "$version" in
        v*) ;;
        *) version="v${version}" ;;
      esac

      if [ -n "$UPD_EXECUTABLE" ]; then
        upd_bin="$UPD_EXECUTABLE"
      else
        target="${UPD_TARGET}"
        if [ -z "$target" ]; then
          case "$(uname -m)" in
            x86_64|amd64) target="x86_64-unknown-linux-gnu" ;;
            aarch64|arm64) target="aarch64-unknown-linux-gnu" ;;
            *)
              echo "Unsupported runner architecture: $(uname -m); set upd_target explicitly" >&2
              exit 4
              ;;
          esac
        fi

        expected_sha="${UPD_SHA256}"
        if [ -z "$expected_sha" ] && [ "$version" = "v0.15.0" ]; then
          case "$target" in
            x86_64-unknown-linux-gnu)
              expected_sha="4824da03a43a1238fd17b35580a1e53dbd851996ae025980231d834295ac7f86"
              ;;
            x86_64-unknown-linux-musl)
              expected_sha="76bf403e3d762dab6b5060f5416363813a5b353637a7ae71bae97ab288683c6c"
              ;;
            aarch64-unknown-linux-gnu)
              expected_sha="f63f55a55377d0326410410df460457a93eaebccd2fdf8c5ac66fd329cb806c6"
              ;;
          esac
        fi
        if ! printf '%s\n' "$expected_sha" | grep --extended-regexp --quiet '^[0-9a-fA-F]{64}$'; then
          echo "Set upd_sha256 when overriding upd_version or upd_target" >&2
          exit 4
        fi

        asset="upd-${version}-${target}.tar.gz"
        release_url="https://github.com/rvben/upd/releases/download/${version}"
        curl --silent --show-error --fail-with-body --location \
          --output "$work_dir/$asset" "$release_url/$asset"
        actual_sha="$(sha256sum "$work_dir/$asset" | cut -d ' ' -f 1)"
        if [ "$(printf '%s' "$actual_sha" | tr 'A-F' 'a-f')" != \
          "$(printf '%s' "$expected_sha" | tr 'A-F' 'a-f')" ]; then
          echo "Checksum verification failed for $asset" >&2
          exit 2
        fi
        tar --extract --gzip --file "$work_dir/$asset" --directory "$work_dir" upd
        chmod 0755 "$work_dir/upd"
        upd_bin="$work_dir/upd"
      fi

      if [ ! -x "$upd_bin" ]; then
        echo "upd executable is missing or not executable: $upd_bin" >&2
        exit 2
      fi

      # upd owns the rest of the job: branch ownership, rebuild, update,
      # validation, lease-protected push and the merge request. It reads the
      # UPD_* variables above and the CI_* variables GitLab provides.
      "$upd_bin" gitlab run --output text
      UPD_JOB
