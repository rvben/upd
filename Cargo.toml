[package]
name = "upd"
version = "0.8.5"
edition = "2024"
rust-version = "1.95.0"
description = "Local-first dependency updates for polyglot repositories, including Python, Node.js, Rust, Go, Ruby, .NET, Terraform, GitHub Actions, pre-commit, and Mise"
license = "MIT"
repository = "https://github.com/rvben/upd"
homepage = "https://github.com/rvben/upd"
documentation = "https://github.com/rvben/upd#readme"
authors = ["Ruben Jongejan <ruben.jongejan@gmail.com>"]
keywords = ["dependencies", "update", "python", "nodejs", "rust"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
exclude = [
    ".github/*",
    ".gitignore",
    "scripts/*",
    "target/*",
]

[lib]
name = "upd"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "upd"
path = "src/main.rs"

[[bin]]
name = "upd-cli"
path = "src/bin/upd-cli.rs"

[dependencies]
# CLI
clap = { version = "4.6.6", features = ["derive"] }

# Async runtime + HTTP
tokio = { version = "1.53.1", features = ["full"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "gzip", "native-tls-vendored"] }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1"
toml_edit = "0.25.13+spec-1.1.0"

# Version parsing
pep440_rs = "0.7.3"
semver = "1.0.28"

# File handling
ignore = "0.4.33"
globset = "0.4.20"
directories = "6.0.0"

# Error handling
anyhow = "1.0.104"
thiserror = "2.0.20"

# Misc
regex = "1.13.1"
colored = "3.1.1"
async-trait = "0.1.92"
futures = "0.3.34"
url = "2.5"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }

jsonschema = { version = "0.46.5", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6"
serial_test = "3.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
